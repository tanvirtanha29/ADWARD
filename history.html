return o.data}catch(e){return ''}}

var viaCanvas=function(img){
try{
var w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
if(!w||!h)return;
var scale=Math.min(1,512/Math.max(w,h));
var c=document.createElement('canvas');
c.width=Math.max(1,Math.round(w*scale));
c.height=Math.max(1,Math.round(h*scale));
var cx=c.getContext('2d');
cx.imageSmoothingEnabled=true;cx.imageSmoothingQuality='high';
cx.drawImage(img,0,0,c.width,c.height);
save(c.toDataURL('image/png'));
updateLogoImg()}catch(e){}};
fetch(LOGO_URL,{mode:'cors'}).then(function(r){
if(!r.ok)throw new Error('http '+r.status);return r.blob()}).then(function(b){
return new Promise(function(res,rej){

probe.src=dataUrl}).catch(function(){

function stBadge(st){
st=String(st||'');
if(st==='completed')return '<span class="st st-completed">Completed</span>';
if(isCanceledSt(st))return '<span class="st st-canceled">Canceled</span>';
return '<span class="st st-pending">Pending</span>'}
function txnRow(t){
var m=TXN_META[t.type]||TXN_META.bonus,neg=t.amount<0,canc=isCanceledSt(t.status);
var refundLine=(t.type==='withdraw'&&canc)
?'<div class="t2" style="color:'+(t.refundPaid===true?'var(--green-d)':'var(--amber)')+';font-weight:700">'
+(t.refundPaid===true?money(Math.abs(Number(t.amount)||0))+' returned to your balance':'Refund processing…')+'</div>':'';
return '<div class="trow"><div class="tint tint-'+m[1]+'">'+ic(m[0])+'</div>'
+'<div class="tinfo"><div class="t1">'+t.title+'</div><div class="t2">'+fmtDT(t.at)+' · '+t.id+'</div>'+refundLine+'</div>'
+'<div class="tright"><div class="tamt '+(neg?'neg':'pos')+'">'+(neg?'−':'+')+money(Math.abs(t.amount))+'</div>'
+stBadge(t.status)+'</div></div>'}
function filtered(){
var list=(ALL||[]).slice();
if(filter==='earnings')list=list.filter(function(t){return t.amount>0&&t.type!=='withdraw'&&t.type!=='refund'});
else if(filter==='withdrawals')list=list.filter(function(t){return t.type==='withdraw'||t.type==='refund'});
else if(filter==='pending')list=list.filter(function(t){return t.status==='pending'});
else if(filter==='completed')list=list.filter(function(t){return t.status==='completed'});
else if(filter==='canceled')list=list.filter(function(t){return isCanceledSt(t.status)});
return list}
function renderList(reset){
if(reset)shown=0;
var list=filtered(),box=$('#hList');
if(!box)return;
if(!list.length){box.innerHTML='<div class="empty card"><div class="eico">'+ic('history')+'</div><h3>Nothing here yet</h3><p>Try a different filter, or start earning to see activity.</p><a class="btn btn-primary btn-sm" href="earn.html">Start earning</a></div>';icons();return}
shown=reset?Math.min(PAGE,list.length):Math.min(shown+PAGE,list.length);
var hasMore=shown<list.length;
box.innerHTML='<div class="card" style="padding:2px 0">'+list.slice(0,shown).map(txnRow).join('')+'</div>'
+(hasMore?'<div style="text-align:center;margin-top:14px"><button class="btn btn-ghost btn-sm" id="more">'+ic('chevron-down')+' Load more</button></div>':'');
icons();
var m=$('#more');if(m)m.addEventListener('click',function(){renderList(false)});
try{sessionStorage.setItem(snapK(),$('#view').innerHTML)}catch(e){}}
function snapK(){return 'earnly_snap_history_'+UID}
function renderShell(){
 $('#view').innerHTML='<div class="phead ptitle"><h1>Transaction History</h1><p>Every credit and withdrawal, with full references.</p></div>'
+'<div class="fchips" id="hf">'+FILTERS.map(function(f){
return '<button class="fchip '+(f[0]===filter?'on':'')+'" data-f="'+f[0]+'">'+f[1]+'</button>'}).join('')+'</div>'
+'<div id="hList"></div>';
icons();
 $$('#hf .fchip').forEach(function(b){b.addEventListener('click',function(){
filter=b.dataset.f;
 $$('#hf .fchip').forEach(function(x){x.classList.toggle('on',x===b)});
renderList(true)})});
renderList(true)}
/* ===== REFUND ENGINE — atomic, one-time ===== */
var refunding={};
function processRefund(t){
if(!UID||refunding[t.id])return;
refunding[t.id]=1;
var wRef=fs.collection('users').doc(UID).collection('txns').doc(t.id);
var rRef=fs.collection('users').doc(UID).collection('txns').doc('refund_'+t.id);
var uRef=fs.collection('users').doc(UID);
fs.runTransaction(function(tr){
return tr.get(wRef).then(function(ws){
if(!ws.exists)return null;
var w=ws.data();
if(!isCanceledSt(w.status))return null;
if(w.refundPaid===true)return null;
var amt=round2(Math.abs(Number(w.amount)||0));
if(!(amt>0))return null;
return tr.get(uRef).then(function(us){
var p=(us.exists&&us.data())||{};
if(!p.balance)p.balance={available:0,pending:0,earned:0,withdrawn:0};
p.balance.available=round2((Number(p.balance.available)||0)+amt);
p.balance.withdrawn=Math.max(0,round2((Number(p.balance.withdrawn)||0)-amt));
tr.update(wRef,{refundPaid:true,refundedAt:Date.now()});
tr.set(rRef,{id:'refund_'+t.id,at:Date.now(),status:'completed',type:'refund',
title:'Refund · Withdrawal canceled',amount:amt,
note:'Withdrawal '+t.id+' was canceled — '+money(amt)+' returned to your balance'});
tr.set(uRef.collection('notifs').doc(),{at:Date.now(),read:false,kind:'money',icon:'refresh-cw',
title:'Withdrawal canceled',
body:'Your '+money(amt)+' withdrawal was canceled. '+money(amt)+' has been returned to your available balance.'});
tr.update(uRef,{balance:p.balance});
return amt})})})
.then(function(amt){
delete refunding[t.id];
if(amt>0){
toast(money(amt)+' refunded to your balance','info','A withdrawal was canceled — money returned');
if(ME&&ME.balance){ME.balance.available=round2((Number(ME.balance.available)||0)+amt);
ME.balance.withdrawn=Math.max(0,round2((Number(ME.balance.withdrawn)||0)-amt));saveME()}}})
.catch(function(e){console.warn('refund failed',e);delete refunding[t.id]})}
function saveME(){try{var old=JSON.parse(localStorage.getItem('earnly_dash_cache_v1')||'{}');old.uid=UID;old.me=ME;localStorage.setItem('earnly_dash_cache_v1',JSON.stringify(old))}catch(e){}}
var sawUser=false,handled=false;
auth.onAuthStateChanged(function(u){
if(!u){
if(sawUser){
try{localStorage.removeItem(FLAG);localStorage.removeItem('earnly_uid');
localStorage.removeItem('earnly_dash_cache_v1');localStorage.removeItem('earnly_earn_cache_v1');
sessionStorage.clear()}catch(e){}
location.replace('index.html?out='+Date.now());return}
showLoginSheet();return}
if(handled)return;handled=true;sawUser=true;
hideLoginSheet();
UID=u.uid;localStorage.setItem('earnly_uid',UID);localStorage.setItem(FLAG,'1');
snapKey='earnly_snap_history_'+UID;
if(!_snap){renderShell()}
fs.collection('users').doc(UID).collection('txns').orderBy('at','desc').limit(100).onSnapshot(function(q){
ALL=[];q.forEach(function(d){ALL.push(d.data())});
if(ALL.length===0)ALL=null;
renderShell();
(ALL||[]).forEach(function(t){
if(t.type==='withdraw'&&isCanceledSt(t.status)&&t.refundPaid!==true)processRefund(t)})},
function(){
if(!ALL)$('#view').innerHTML='<div class="card" style="padding:24px;text-align:center"><b>Could not load history</b><p style="color:var(--ink2);font-size:13.5px;margin-top:6px">Check your connection and reload.</p></div>'})});
</script>
