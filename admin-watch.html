<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Manage Watch Ad — Earnly Admin</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="%230D63F2"/><path d="M13 2 4.5 13.5H11L10 22l8.5-11.5H12L13 2z" fill="white"/></svg>'>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#F6F8F7;--line:#E6ECE8;--line2:#EEF2F0;--ink:#101A14;--ink2:#57645C;--ink3:#94A29A;--mint:#E9F7EE;--mint2:#D9F0E2;--green:#16A15C;--green-d:#0B7B44;--blue:#0D63F2;--blue-d:#0A52CC;--blue-s:#EBF2FE;--amber:#B25E09;--amber-s:#FDF1DF;--red:#D92D20;--red-s:#FCEBEB;--sh-sm:0 1px 2px rgba(16,24,40,.05);--sh-md:0 8px 24px rgba(16,24,40,.08);--font:'Plus Jakarta Sans',sans-serif;--num:'Sora',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration:none}button{font-family:var(--font)}
.grow{flex:1}.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh-sm)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14.5px;border:1px solid transparent;border-radius:12px;height:46px;padding:0 20px;cursor:pointer;transition:.18s;background:none;color:var(--ink)}
.btn svg{width:17px;height:17px}.btn:active{transform:scale(.975)}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:var(--blue-d)}
.btn-ghost{background:#fff;border-color:var(--line)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;background:#F2F6F3;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;color:var(--ink2);white-space:nowrap}
.chip svg{width:12px;height:12px}.chip-mint{background:var(--mint);color:var(--green-d)}
.ico-btn{position:relative;width:40px;height:40px;border-radius:12px;border:none;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink)}.ico-btn:hover{background:var(--line2)}.ico-btn svg{width:21px;height:21px}
.dhdr{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line2);height:60px;display:flex;align-items:center;gap:8px;padding:0 16px}
.brand{display:flex;align-items:center;gap:9px;color:var(--ink);font:800 17px var(--num)}.brand .mark{width:32px;height:32px;border-radius:10px;background:var(--blue);color:#fff;display:grid;place-items:center}.brand .mark svg{width:17px;height:17px}
.main{max-width:560px;margin:0 auto;padding:22px 16px calc(48px + env(safe-area-inset-bottom))}
@media(min-width:1024px){.main{padding:28px 32px 64px}}
.phead{margin-bottom:18px}.ptitle h1{font:800 22px/1.25 var(--num)}.ptitle p{color:var(--ink2);font-size:14px;margin-top:4px}
/* ===== FORM ===== */
.form{padding:20px 18px}
.flab{display:block;font-size:12.5px;font-weight:800;color:var(--ink2);margin:0 0 6px}
.fhint{font-size:12px;color:var(--ink3);font-weight:600;margin-top:6px}
.frow{margin-bottom:18px}
.fin{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font:600 14px var(--font);color:var(--ink);background:#fff;transition:border-color .15s,box-shadow .15s;outline:none}
.fin:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-s)}
.fin[disabled]{background:var(--line2);color:var(--ink3)}
.fin.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
textarea.fin{height:auto;min-height:74px;padding:11px 14px;resize:vertical;line-height:1.5}
.check{display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none;font-size:13.5px;font-weight:700;color:var(--ink2)}
.check input{width:18px;height:18px;accent-color:var(--blue);cursor:pointer}
.prechips{display:flex;gap:6px;flex-wrap:wrap;padding:14px 0 2px}
.acts{display:flex;gap:10px;margin-top:6px}
.acts .btn{flex:1}
.savedat{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--ink3);margin-top:14px}
.savedat svg{width:14px;height:14px}
/* ===== SKELETON ===== */
.sk{background:#E7EEE9;border-radius:10px;position:relative;overflow:hidden}
.sk::after{content:'';position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:shim 1.4s infinite}
@keyframes shim{to{transform:translateX(100%)}}
/* ===== NOTES / WARN ===== */
.note{display:flex;gap:11px;padding:13px 15px;background:var(--blue-s);border:1px solid #D6E6FF;border-radius:14px;font-size:13px;color:var(--ink2);font-weight:500;margin-top:16px}
.note svg{width:17px;height:17px;color:var(--blue);flex:none;margin-top:1px}
.note.warn{background:var(--amber-s);border-color:#F5DFC0}.note.warn svg{color:var(--amber)}
/* ===== TOASTS ===== */
#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;width:min(92vw,390px);pointer-events:none}
.toast{pointer-events:auto;display:flex;gap:11px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--sh-md);animation:tin .3s;cursor:pointer}
.toast.out{animation:tout .25s forwards}
@keyframes tin{from{opacity:0;transform:translateY(-14px) scale(.96)}}
@keyframes tout{to{opacity:0;transform:translateY(-10px) scale(.97)}}
.toast .ti{width:27px;height:27px;border-radius:9px;display:grid;place-items:center;flex:none}.toast .ti svg{width:15px;height:15px}
.toast.t-success .ti{background:var(--mint);color:var(--green-d)}.toast.t-error .ti{background:var(--red-s);color:var(--red)}
.toast.t-info .ti{background:var(--blue-s);color:var(--blue)}.toast.t-warn .ti{background:var(--amber-s);color:var(--amber)}
.toast b{display:block;font-size:13.5px}.toast span{display:block;font-size:12.5px;color:var(--ink2);margin-top:1px}
</style>
</head>
<body>
<div id="toasts"></div>

<header class="dhdr"><button class="ico-btn" onclick="location.href='/watch.html'"><i data-lucide="arrow-left"></i></button>
<a class="brand" href="/watch.html"><span class="mark"><i data-lucide="zap"></i></span>Earnly <span style="color:var(--ink3);font:700 12px var(--font)">Admin</span></a>
<div class="grow"></div><button class="ico-btn" onclick="location.href='/watch.html'"><i data-lucide="external-link"></i></button></header>

<main class="main"><div id="view"></div></main>

<script>
function $(s,r){return (r||document).querySelector(s)}
function icons(){if(window.lucide)lucide.createIcons()}
function ic(n){return '<i data-lucide="'+n+'"></i>'}
function money(n){return '৳'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function sk(w,h,r){return '<span class="sk" style="display:block;width:'+(typeof w==='string'?w:w+'px')+';height:'+h+'px'+(r?';border-radius:'+r+'px':'')+'"></span>'}

/* ============ FIREBASE ============ */
const firebaseConfig = {
  apiKey: "AIzaSyDyntEXdOxJKaiqzU0p6gr8MNzAUqJ1dqE",
  authDomain: "earning-app-6d638.firebaseapp.com",
  projectId: "earning-app-6d638",
  storageBucket: "earning-app-6d638.firebasestorage.app",
  messagingSenderId: "813497830586",
  appId: "1:813497830586:web:8f728409eaaccd08c34683",
  measurementId: "G-K0E6MNRS8R"
};
firebase.initializeApp(firebaseConfig);
var fs=firebase.firestore();
var cfgRef=function(){return fs.collection('config').doc('watch')};

/* ============ TOASTS ============ */
function toast(type,title,msg){
var box=$('#toasts');if(!box)return;
var icon=type==='success'?'check':type==='error'?'x':type==='warn'?'alert-triangle':'info';
var el=document.createElement('div');el.className='toast t-'+type;
el.innerHTML='<span class="ti">'+ic(icon)+'</span><div><b>'+title+'</b>'+(msg?'<span>'+msg+'</span>':'')+'</div>';
box.appendChild(el);icons();
var kill=function(){el.classList.add('out');setTimeout(function(){el.remove()},260)};
el.onclick=kill;setTimeout(kill,4200)}

/* ============ SKELETON (mirrors the form layout) ============ */
function skelMain(){
var s='';
/* page head: title 1 line + subtitle 2 lines */
s+='<div class="phead">'
+sk(180,26,8)
+'<div style="height:10px"></div>'
+sk('100%',12,6)
+'<div style="height:7px"></div>'
+sk('68%',12,6)
+'</div>';
/* form card: link label + textarea, 2-col grid, limit + checkbox, chips, buttons */
s+='<div class="card" style="padding:20px 18px">'
+sk(96,13,6)+'<div style="height:6px"></div>'+sk('100%',74,12)
+'<div style="height:6px"></div>'+sk('55%',10,5)
+'<div style="height:18px"></div>'
+'<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">'
+'<div>'+sk(110,13,6)+'<div style="height:6px"></div>'+sk('100%',46,12)+'</div>'
+'<div>'+sk(100,13,6)+'<div style="height:6px"></div>'+sk('100%',46,12)+'</div>'
+'</div>'
+'<div style="height:6px"></div>'+sk('62%',10,5)
+'<div style="height:18px"></div>'
+sk(110,13,6)+'<div style="height:6px"></div>'+sk('100%',46,12)
+'<div style="height:12px"></div>'
+'<div style="display:flex;align-items:center;gap:9px">'+sk(18,18,5)+sk(210,13,6)+'</div>'
+'<div style="height:14px"></div>'
+'<div style="display:flex;justify-content:flex-start;gap:8px">'+sk(128,24,999)+sk(112,24,999)+sk(88,24,999)+'</div>'
+'<div style="height:16px"></div>'
+'<div style="display:flex;gap:10px">'+sk('50%',46,12)+sk('50%',46,12)+'</div>'
+'<div style="height:14px"></div>'
+'<div style="display:flex;align-items:center;gap:7px">'+sk(14,14,4)+sk(230,11,5)+'</div>'
+'</div>';
/* note boxes */
s+='<div style="margin-top:16px;display:flex;gap:11px;padding:13px 15px;background:var(--amber-s);border:1px solid #F5DFC0;border-radius:14px">'
+'<span class="sk" style="display:block;flex:none;width:17px;height:17px;border-radius:5px;margin-top:2px"></span>'
+'<div class="grow">'+sk('100%',11,5)+'<div style="height:6px"></div>'+sk('70%',11,5)+'</div></div>';
return s}

/* ============ STATE (demo defaults) ============ */
var CFG={link:'',reward:2,minSeconds:15,daily:0};
var loaded=false;

/* ============ SHOW SKELETON IMMEDIATELY ============ */
 $('#view').innerHTML=skelMain();icons();

/* ============ FORM ============ */
function previewChips(){
var d=Number($('#fDaily').value);
var unlimited=$('#fUnlimited').checked||!d||d<=0;
return '<span class="chip chip-mint">'+ic('coins')+' '+money($('#fReward').value)+' per watch</span>'
+'<span class="chip">'+ic('clock')+' '+($('#fMin').value||0)+'s minimum</span>'
+(unlimited?'<span class="chip">'+ic('infinity')+' Unlimited</span>'
:'<span class="chip">'+ic('repeat')+' '+$('#fDaily').value+' per day</span>')}

function formHtml(){
var status=loaded
?'<div class="savedat" id="savedat">'+ic('check')+' Loaded from Firebase</div>'
:'<div class="savedat" id="savedat">'+ic('circle-dashed')+' Demo fields — press Save to create them in Firebase</div>';
return '<div class="phead ptitle"><h1>Manage Watch Ad</h1><p>Fill the fields and press Save — they are created in Firebase and served to every user on the Watch &amp; Earn page.</p></div>'
+'<div class="card form">'
+'<div class="frow"><label class="flab" for="fLink">Adsterra direct link</label>'
+'<textarea class="fin mono" id="fLink" rows="2" placeholder="https://www.profitableratecpm.com/..." spellcheck="false">'+(CFG.link||'')+'</textarea>'
+'<div class="fhint">Paste the Direct Link URL from Adsterra → Direct Links. Must start with https://</div></div>'
+'<div class="frow"><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">'
+'<div><label class="flab" for="fReward">Reward per watch (৳)</label>'
+'<input class="fin" id="fReward" type="number" min="0.5" step="0.5" value="'+CFG.reward+'"></div>'
+'<div><label class="flab" for="fMin">Minimum seconds</label>'
+'<input class="fin" id="fMin" type="number" min="1" step="1" value="'+CFG.minSeconds+'"></div>'
+'</div><div class="fhint">User must stay on the ad tab at least this long to be credited.</div></div>'
+'<div class="frow"><label class="flab" for="fDaily">Daily watch limit</label>'
+'<input class="fin" id="fDaily" type="number" min="0" step="1" value="'+CFG.daily+'"'+(CFG.daily<=0?' disabled':'')+'>'
+'<label class="check" style="margin-top:9px"><input type="checkbox" id="fUnlimited"'+(CFG.daily<=0?' checked':'')+'> Unlimited — no daily limit (saves 0)</label></div>'
+'<div class="prechips" id="prechips"></div>'
+'<div class="acts">'
+'<button class="btn btn-ghost" id="testBtn">'+ic('external-link')+' Test link</button>'
+'<button class="btn btn-primary" id="saveBtn">'+ic('save')+' Save changes</button>'
+'</div>'
+status
+'</div>'
+'<div class="note warn">'+ic('unlock')+'<span>This page has <b>no login</b> — keep the URL private so nobody else can change your ad settings.</span></div>'}

function refreshPreview(){$('#prechips').innerHTML=previewChips();icons()}

function bindForm(){
 $('#fUnlimited').addEventListener('change',function(){
 $('#fDaily').disabled=this.checked;
if(this.checked)$('#fDaily').value=0;
refreshPreview()});
['fReward','fMin','fDaily'].forEach(function(id){
 $('#'+id).addEventListener('input',refreshPreview)});
 $('#testBtn').addEventListener('click',function(){
var link=($('#fLink').value||'').trim();
if(link.indexOf('http')!==0){toast('warn','Invalid link','Enter a link starting with https:// first');return}
window.open(link,'_blank')});
 $('#saveBtn').addEventListener('click',save)}

function renderForm(){
 $('#view').innerHTML=formHtml();icons();bindForm();refreshPreview()}

/* ============ SAVE → creates/updates the fields in Firebase ============ */
function save(){
var link=($('#fLink').value||'').trim();
var reward=Number($('#fReward').value);
var minS=Number($('#fMin').value);
var daily=$('#fUnlimited').checked?0:Number($('#fDaily').value);
if(link.indexOf('http')!==0){toast('error','Invalid link','The ad link must start with https://');return}
if(!(reward>0)){toast('error','Invalid reward','Reward must be greater than 0');return}
if(!(minS>=1)){toast('error','Invalid seconds','Minimum seconds must be at least 1');return}
if(!$('#fUnlimited').checked&&daily<1){toast('error','Invalid limit','Daily limit must be at least 1 — or tick Unlimited');return}
var btn=$('#saveBtn');btn.disabled=true;
btn.innerHTML=ic('loader-2')+' Saving…';icons();
cfgRef().set({
link:link,
reward:reward,
minSeconds:minS,
daily:daily,
updatedAt:firebase.firestore.FieldValue.serverTimestamp()
},{merge:true}).then(function(){
btn.disabled=false;btn.innerHTML=ic('save')+' Save changes';icons();
 $('#savedat').innerHTML=ic('clock')+' Saved to Firebase just now';icons();
toast('success','Fields created in Firebase','link, reward, minSeconds and daily are now live — Watch & Earn picks them up on next load');
}).catch(function(err){
btn.disabled=false;btn.innerHTML=ic('save')+' Save changes';icons();
toast('error','Save failed',(err&&err.code==='permission-denied')
?'Firestore rules are blocking writes. Allow write for the config collection in Firebase console → Rules'
:'Check your connection and try again')})}

/* ============ LOAD — skeleton shows until Firebase answers ============ */
cfgRef().get().then(function(snap){
if(snap.exists){
loaded=true;
var c=snap.data();
if(typeof c.link==='string'&&c.link)CFG.link=c.link;
if(typeof c.reward==='number'&&c.reward>0)CFG.reward=c.reward;
if(typeof c.minSeconds==='number'&&c.minSeconds>=1)CFG.minSeconds=c.minSeconds;
if(typeof c.daily==='number')CFG.daily=c.daily;
}
renderForm()}).catch(function(){
/* rules blocked or offline → form still opens with demo values */
renderForm()});
</script>
</body>
</html>
