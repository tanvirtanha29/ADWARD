function uRef(){return fs.collection('users').doc(UID)}
function snapK(){return 'earnly_snap_notifs_'+UID}
function tintOf(n){return n.kind==='reward'?'green':n.kind==='alert'?'amber':n.kind==='money'?'blue':'ink'}
function render(){
var isG=!LOGGED_IN||!ME;
var list=isG?null:(LIST||[]);
var unread=isG?0:list.filter(function(n){return !n.read}).length;
var bd=$('#bellBadge');
if(bd){bd.style.display=unread?'grid':'none';bd.textContent=unread>9?'9+':unread}
var sy=window.scrollY;
view.innerHTML='<div class="phead ptitle"><h1>Notifications</h1><p>Rewards, withdrawals and announcements.</p></div>'
+(list&&list.length
?'<div style="display:flex;justify-content:flex-end;margin-bottom:12px">'
+'<button class="btn btn-ghost btn-sm" id="ra" '+(unread?'':'disabled')+'>'+ic('check-check')+' Mark all read</button></div>'
+'<div class="card" style="padding:2px 0">'+list.map(function(n){
return '<div class="nrow'+(n.read?'':' unread')+'" data-n="'+n._id+'">'
+'<div class="tint tint-'+tintOf(n)+'">'+ic(n.icon||'bell')+(n.read?'':'<span class="badge-dot"></span>')+'</div>'
+'<div class="ninfo"><div class="t1">'+n.title+'</div>'
+'<div class="t2">'+n.body+'</div>'
+'<div class="t3">'+ago(n.at)+'</div></div></div>'}).join('')+'</div>'
:'<div class="empty card"><div class="eico">'+ic('bell')+'</div><h3>'+(isG?'Your notifications live here':'All caught up')+'</h3>'
+'<p>'+(isG?'Sign in to see reward credits, withdrawal updates, streak reminders and announcements.':'New rewards, withdrawal updates and announcements will land here.')+'</p>'
+(isG?'<div style="display:flex;gap:10px;margin-top:14px"><a class="btn btn-ghost btn-sm" href="login.html">Sign in</a><a class="btn btn-primary btn-sm" href="register.html">Create account</a></div>':'')
+'</div>');
icons();
window.scrollTo(0,sy);
var ra=$('#ra');
if(ra)ra.addEventListener('click',function(){
var batch=fs.batch();
(list||[]).forEach(function(n){if(!n.read)batch.update(uRef().collection('notifs').doc(n._id),{read:true})});
batch.commit().then(function(){
list.forEach(function(n){n.read=true});
render();try{sessionStorage.setItem(snapK(),view.innerHTML)}catch(e){}
try{var c=JSON.parse(localStorage.getItem('earnly_dash_cache_v1')||'{}');if(c.me){c.unread=0;localStorage.setItem('earnly_dash_cache_v1',JSON.stringify(c))}}catch(e){}
toast('All notifications marked read','info')}).catch(function(){toast('Could not update','error')})});
 $$('[data-n]',view).forEach(function(el){el.addEventListener('click',function(){
var n=null;(list||[]).forEach(function(x){if(x._id===el.dataset.n)n=x});
if(n&&!n.read){
n.read=true;
fs.collection('users').doc(UID).collection('notifs').doc(n._id).update({read:true}).then(function(){render()}).catch(function(){render()});
try{var c=JSON.parse(localStorage.getItem('earnly_dash_cache_v1')||'{}');if(c.me&&c.unread>0){c.unread--;localStorage.setItem('earnly_dash_cache_v1',JSON.stringify(c))}}catch(e){}}})});
fillDrawer();
try{sessionStorage.setItem(snapK(),view.innerHTML)}catch(e){}}
function fetchAll(){
return uRef().collection('notifs').orderBy('at','desc').limit(30).get()
.then(function(snap){
LIST=[];UNREAD=0;
snap.forEach(function(d){
var n=d.data();n._id=d.id;
LIST.push(n);
if(!n.read)UNREAD++});
saveUnread();
return true})}
function saveUnread(){try{var c=JSON.parse(localStorage.getItem('earnly_dash_cache_v1')||'{}');if(c.me){c.unread=UNREAD;localStorage.setItem('earnly_dash_cache_v1',JSON.stringify(c))}}catch(e){}}
var sawUser=false,handled=false;
auth.onAuthStateChanged(function(u){
if(!u){
if(sawUser){
try{localStorage.removeItem(FLAG);localStorage.removeItem('earnly_uid');
localStorage.removeItem('earnly_dash_cache_v1');localStorage.removeItem('earnly_earn_cache_v1');
sessionStorage.clear()}catch(e){}
location.replace('index.html?out='+Date.now());return}
showLoginSheet();return}
if(handled)return;handled=true;sawUser=true;
LOGGED_IN=true;
hideLoginSheet();
UID=u.uid;localStorage.setItem('earnly_uid',UID);localStorage.setItem(FLAG,'1');
if(!ME){var c=loadCache();if(c&&c.me)ME=c.me}
if(!ME){location.replace('index.html');return}
fetchAll()
.then(function(){render()})
.catch(function(e){
toast('Could not load notifications: '+(e&&e.message||'error'),'error');
render()})});
</script>
</body>
</html>
