<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Daily Tasks — Adward</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="%230D63F2"/><path d="M13 2 4.5 13.5H11L10 22l8.5-11.5H12L13 2z" fill="white"/></svg>'>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#F6F8F7;--line:#E6ECE8;--line2:#EEF2F0;--ink:#101A14;--ink2:#57645C;--ink3:#94A29A;--mint:#E9F7EE;--mint2:#D9F0E2;--mint3:#C4E8D2;--green:#16A15C;--green-d:#0B7B44;--blue:#0D63F2;--blue-d:#0A52CC;--blue-s:#EBF2FE;--amber:#B25E09;--amber-s:#FDF1DF;--red:#D92D20;--red-s:#FCEBEB;--sh-sm:0 1px 2px rgba(16,24,40,.05);--sh-md:0 8px 24px rgba(16,24,40,.08);--font:'Plus Jakarta Sans',sans-serif;--num:'Sora',sans-serif;--brand:'Space Grotesk','Sora',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration:none}button{font-family:var(--font)}
.grow{flex:1}.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh-sm)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14.5px;border:1px solid transparent;border-radius:12px;height:46px;padding:0 20px;cursor:pointer;transition:.18s;background:none;color:var(--ink)}
.btn svg{width:17px;height:17px}.btn:active{transform:scale(.975)}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:var(--blue-d)}
.btn-ghost{background:#fff;border-color:var(--line)}
.btn-sm{height:37px;padding:0 15px;font-size:13.5px;border-radius:10px}
.btn[disabled]{opacity:.75;cursor:not-allowed}
.spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;display:inline-block;animation:rot .7s linear infinite;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}
.chip{display:inline-flex;align-items:center;gap:5px;background:#F2F6F3;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;color:var(--ink2);white-space:nowrap}
.chip svg{width:12px;height:12px}.chip-mint{background:var(--mint);color:var(--green-d)}.chip-blue{background:var(--blue-s);color:var(--blue)}
.tint{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}.tint svg{width:19px;height:19px}
.tint-green{background:var(--mint);color:var(--green-d)}
/* ===== TASK LOGO — fixed container, image fills it entirely =====
   Container is locked (min=max) and overflow hidden, so the image
   can never resize it. --timg-fit controls the fill mode:
   cover = fill container, crop overflow (recommended)
   fill  = literal stretch to the container's exact shape        */
.taskimg{--timg-fit:cover;position:relative;width:56px;height:56px;border-radius:14px;overflow:hidden;flex:none;background:var(--mint);min-width:56px;max-width:56px;min-height:56px;max-height:56px}
.taskimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:var(--timg-fit);display:block;pointer-events:none}
.ico-btn{width:40px;height:40px;border-radius:12px;border:none;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink)}.ico-btn:hover{background:var(--line2)}.ico-btn svg{width:21px;height:21px}
.badge-dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;background:var(--red);color:#fff;border-radius:999px;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px;border:2px solid #fff}
.avatar{border-radius:50%;background:var(--mint);border:1px solid var(--mint3);color:var(--green-d);display:grid;place-items:center;font:800 13px var(--num);flex:none}
.dhdr{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line2);height:60px;display:flex;align-items:center;gap:8px;padding:0 16px}
/* Site name in Space Grotesk — same brand style as the dashboard */
.brand{display:flex;align-items:center;gap:9px;color:var(--ink);font:800 17px var(--brand)}
/* Mark 37×37, image fills it; header height stays exactly 60px */
.brand .mark{width:37px;height:37px;border-radius:11px;background:var(--blue);color:#fff;display:grid;place-items:center;overflow:hidden;flex:none}
.brand .mark img{width:100%;height:100%;object-fit:cover;display:block}
.dover{position:fixed;inset:0;background:rgba(16,26,20,.42);opacity:0;visibility:hidden;transition:.22s;z-index:90}.dover.open{opacity:1;visibility:visible}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(216px,56vw);background:#fff;z-index:95;transform:translateX(105%);transition:transform .3s cubic-bezier(.2,.8,.3,1);display:flex;flex-direction:column;border-left:1px solid var(--line2);padding:16px 10px calc(16px + env(safe-area-inset-bottom));overflow-y:auto}.drawer.open{transform:none}
.dprof{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;border-bottom:1px solid var(--line2);margin-bottom:6px}.dprof b{display:block;font-size:14px}.dprof span{font:700 12px var(--num);color:var(--green-d)}
.sgroup{font-size:10px;font-weight:800;letter-spacing:1px;color:var(--ink3);text-transform:uppercase;padding:12px 10px 6px}
.slink{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:11px;color:var(--ink2);font-size:13.5px;font-weight:600;border:none;background:none;width:100%;text-align:left;cursor:pointer;text-decoration:none}.slink svg{width:17px;height:17px;flex:none}.slink:hover{background:#F4F8F5;color:var(--ink)}.slink.on{background:var(--blue-s);color:var(--blue)}
.dfoot{margin-top:auto;border-top:1px solid var(--line2);padding-top:10px}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line2);display:flex;padding:5px 6px calc(5px + env(safe-area-inset-bottom))}
.bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0 3px;color:var(--ink3);font-size:10.5px;font-weight:700;text-decoration:none}
.bnav .bi{display:flex;padding:5px 16px;border-radius:999px;transition:background .18s}
.bnav svg{width:20px;height:20px}.bnav a.on{color:var(--blue)}.bnav a.on .bi{background:var(--blue-s)}
.netban{position:sticky;top:60px;z-index:39;background:var(--amber-s);color:var(--amber);font-size:13px;font-weight:700;display:none;align-items:center;justify-content:center;gap:8px;padding:8px 14px}.netban svg{width:15px;height:15px}
.main{max-width:680px;margin:0 auto;padding:18px 16px calc(96px + env(safe-area-inset-bottom))}
@media(min-width:1024px){.main{max-width:1020px;padding:28px 32px 80px}}
.phead{margin-bottom:18px}.ptitle h1{font:800 22px/1.25 var(--num)}.ptitle p{color:var(--ink2);font-size:14px;margin-top:4px}
.note{display:flex;gap:11px;padding:13px 15px;background:var(--blue-s);border:1px solid #D6E6FF;border-radius:14px;font-size:13px;color:var(--ink2);font-weight:500;margin-top:16px}
.note svg{width:17px;height:17px;color:var(--blue);flex:none;margin-top:1px}
/* ===== STANDALONE TASK CARDS ===== */
.task-row{display:flex;gap:13px;padding:16px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh-sm);margin-bottom:10px}
.task-row:last-child{margin-bottom:0}
.tk-body{flex:1;min-width:0}
.tk-body h4{font-size:14.5px;font-weight:800}
.tk-body p{font-size:12.5px;color:var(--ink2);margin:2px 0 0}
.tk-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}
@media(max-width:420px){.task-row{flex-wrap:wrap}.tk-side{flex-direction:row;width:100%;align-items:center;justify-content:space-between}}
.empty{padding:44px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.eico{width:60px;height:60px;border-radius:50%;background:var(--mint);color:var(--green-d);display:grid;place-items:center;margin-bottom:8px}.eico svg{width:26px;height:26px}
.empty h3{font-size:16.5px;font-weight:800}.empty p{color:var(--ink2);font-size:14px;max-width:320px}
.sk{background:#E7EEE9;border-radius:10px;position:relative;overflow:hidden}
.sk::after{content:'';position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:shim 1.4s infinite}
@keyframes shim{to{transform:translateX(100%)}}
.sheet-back{position:fixed;inset:0;background:rgba(16,26,20,.55);z-index:150;display:flex;align-items:flex-end;justify-content:center;animation:fade .25s;backdrop-filter:blur(3px)}
@keyframes fade{from{opacity:0}}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:26px 22px calc(26px + env(safe-area-inset-bottom));animation:mup .35s;text-align:center}
@keyframes mup{from{transform:translateY(60px);opacity:0}}
.sheet .grip{width:44px;height:5px;border-radius:99px;background:var(--line2);margin:0 auto 18px}
.sheet .slogo{width:54px;height:54px;border-radius:16px;background:var(--blue);color:#fff;display:grid;place-items:center;margin:0 auto 14px;overflow:hidden;flex:none}
.sheet .slogo img{width:100%;height:100%;object-fit:cover;display:block}
.sheet .slogo svg{width:26px;height:26px}
.sheet h2{font:800 20px var(--num);margin-bottom:6px}
.sheet p{color:var(--ink2);font-size:13.5px;font-weight:500;margin-bottom:20px}
.sheet .acts{display:flex;gap:10px}
.sheet .acts .btn{flex:1;height:48px}
#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;width:min(92vw,390px);pointer-events:none}
.toast{pointer-events:auto;display:flex;gap:11px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--sh-md);animation:tin .3s;cursor:pointer}
.toast.out{animation:tout .25s forwards}
@keyframes tin{from{opacity:0;transform:translateY(-14px) scale(.96)}}
@keyframes tout{to{opacity:0;transform:translateY(-10px) scale(.97)}}
.toast .ti{width:27px;height:27px;border-radius:9px;display:grid;place-items:center;flex:none}.toast .ti svg{width:15px;height:15px}
.toast.t-success .ti{background:var(--mint);color:var(--green-d)}.toast.t-error .ti{background:var(--red-s);color:var(--red)}
.toast.t-info .ti{background:var(--blue-s);color:var(--blue)}.toast.t-warn .ti{background:var(--amber-s);color:var(--amber)}
.toast b{display:block;font-size:13.5px}.toast span{display:block;font-size:12.5px;color:var(--ink2);margin-top:1px}
@keyframes sp{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
/* ===== FIX: remove Android/WebView tap highlight + tap focus ring ONLY ===== */
*{-webkit-tap-highlight-color:transparent !important}
a,button,[role="button"],[onclick],input,label,.bnav a,.bnav .bi,.ico-btn,.slink,.btn,.card,.toast,.dover{-webkit-tap-highlight-color:transparent !important}
a:focus:not(:focus-visible),button:focus:not(:focus-visible),.bnav a:focus:not(:focus-visible),.bnav .bi:focus:not(:focus-visible),.ico-btn:focus:not(:focus-visible),.slink:focus:not(:focus-visible),.btn:focus:not(:focus-visible),.toast:focus:not(:focus-visible){outline:none !important}
/* fallback for very old Android WebView without :focus-visible (touch devices only) */
@media (hover:none) and (pointer:coarse){a:focus,button:focus,.bnav a:focus,.bnav .bi:focus,.ico-btn:focus,.slink:focus,.btn:focus,.toast:focus{outline:none !important}}
</style>
</head>
<body>
<div id="toasts"></div>
<div id="app"></div>
<script>
/* ============ SYNC PHASE ============ */
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return [].slice.call((r||document).querySelectorAll(s))}
function icons(){if(window.lucide)lucide.createIcons()}
function ic(n){return '<i data-lucide="'+n+'"></i>'}
function money(n){return '৳'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function money0(n){return '৳'+Number(n||0).toLocaleString('en-US')}
function round2(v){return Math.round(v*100)/100}
function rid(n){var s='',c='ABCDEFGHJKMNPQRSTUVWXYZ23456789';while(n--)s+=c[Math.random()*31|0];return s}
function initials(n){return (n||'').trim().split(/\s+/).map(function(w){return w[0]}).slice(0,2).join('').toUpperCase()}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function ymd(t){var d=t?new Date(t):new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function freshDaily(day){return{day:day,videos:{},scratched:0,spins:0,tasksClaimed:[],scratchLog:[],spinLog:[],activeCard:null,loginDone:false,todayEarned:0}}
function normDaily(d){var k=ymd();return(!d||d.day!==k||d.videos===undefined)?freshDaily(k):d}
var FLAG='earnly_logged_in';

/* ===== STALE-AUTH SELF-HEAL =====
   If Firebase reports signed out while the login flag is still stuck
   in localStorage, the stale flag makes login.html bounce straight
   back → "Sign in does nothing". Purge it on mismatch. */
function purgeStaleAuth(){
try{
if(localStorage.getItem(FLAG)||localStorage.getItem('earnly_uid')){
localStorage.removeItem(FLAG);localStorage.removeItem('earnly_uid');
localStorage.removeItem('earnly_dash_cache_v1');localStorage.removeItem('earnly_earn_cache_v1');
sessionStorage.clear()}
}catch(e){}}

/* ================== TASKS (FIREBASE) ==================
   Collection: tasks   (one document per task — managed in tasksad.html)

   fields per document:
     title     (string)  → task title
     desc      (string)  → description shown below the title
     reward    (number)  → ৳ paid when completed
     frequency (string)  → 'daily' = once per day (resets midnight)
                         → 'once'  = completable only once, forever
     btnLabel  (string)  → action button text
     btnUrl    (string)  → action button link (internal or https://)
     img       (string)  → logo image URL (fills the fixed 56×56 container)
     icon      (string)  → fallback icon name when no image
     order     (number)  → optional sort order (smaller = higher)

   COMPLETION: user taps the action button → the link opens in a new
   tab → when they return, "Verifying…" shows for 1 second, then the
   reward is credited automatically. No minimum wait time.
======================================================== */
var TASKS_DEFAULT=[
{id:'t1',icon:'play',title:'Watch ads',desc:'Open the watch page and check the sponsor ads',reward:1,frequency:'daily',btnLabel:'Watch ads',btnUrl:'watch.html',img:''},
{id:'t2',icon:'gift',title:'Scratch a card',desc:'Reveal a scratch card for a instant prize',reward:1,frequency:'daily',btnLabel:'Scratch now',btnUrl:'scratch.html',img:''},
{id:'t3',icon:'calendar-check',title:'Daily check-in',desc:'Mark today on the check-in calendar',reward:1,frequency:'daily',btnLabel:'Check in',btnUrl:'checkin.html',img:''}];
var TASKS_CONFIG=TASKS_DEFAULT.slice();

var NAV=[
{g:'Overview',items:[['index','house','Dashboard'],['earn','zap','Earn Hub']]},
{g:'Earning',items:[['watch','play','Watch & Earn'],['scratch','gift','Scratch Card'],['tasks','target','Daily Tasks'],['checkin','calendar-check','Daily Check-In'],['spin','disc-3','Spin & Earn'],['offers','puzzle','Offers'],['refer','users','Refer & Earn']]},
{g:'Account',items:[['wallet','wallet','Wallet'],['withdraw','banknote','Withdraw'],['history','history','Transactions'],['notifications','bell','Notifications'],['profile','user','Profile']]}];

/* ================== SITE LOGO (auto-invalidating cache) ==================
   Same shared cache as dashboard/refer/withdraw/history/watch
   (earnly_site_logo_v2) — one download serves every page. */
var LOGO_URL='https://i.ibb.co.com/7J62W1Vy/super-resolution-20260902102855933.png';
var LOGO_KEY='earnly_site_logo_v2';
var LOGO_LEGACY_KEYS=['earnly_watch_ad_logo_v1'];
function logoGet(){
try{
var raw=localStorage.getItem(LOGO_KEY);
if(!raw)return '';
var o=JSON.parse(raw);
if(!o||o.url!==LOGO_URL||!o.data)return '';
return o.data}catch(e){return ''}}
function logoSrc(){return logoGet()||LOGO_URL}
function updateLogoImg(){
var l=logoGet();if(!l)return;
var im=$('#brandLogo')||$('#sheetLogo');
if(im)im.src=l}
function cacheLogo(){
try{LOGO_LEGACY_KEYS.forEach(function(k){localStorage.removeItem(k)})}catch(e){}
if(logoGet())return;
var save=function(d){try{localStorage.setItem(LOGO_KEY,JSON.stringify({url:LOGO_URL,data:d}))}catch(e){}};
var viaCanvas=function(img){
try{
var w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
if(!w||!h)return;
var scale=Math.min(1,512/Math.max(w,h));
var c=document.createElement('canvas');
c.width=Math.max(1,Math.round(w*scale));
c.height=Math.max(1,Math.round(h*scale));
var cx=c.getContext('2d');
cx.imageSmoothingEnabled=true;cx.imageSmoothingQuality='high';
cx.drawImage(img,0,0,c.width,c.height);
save(c.toDataURL('image/png'));
updateLogoImg()}catch(e){}};
fetch(LOGO_URL,{mode:'cors'}).then(function(r){
if(!r.ok)throw new Error('http '+r.status);return r.blob()}).then(function(b){
return new Promise(function(res,rej){
var fr=new FileReader();fr.onload=function(){res(fr.result)};fr.onerror=rej;fr.readAsDataURL(b)})}).then(function(dataUrl){
if(dataUrl&&dataUrl.length<1200000){save(dataUrl);updateLogoImg();return}
var probe=new Image();
probe.onload=function(){viaCanvas(probe)};
probe.src=dataUrl}).catch(function(){
var img=new Image();img.crossOrigin='anonymous';
img.onload=function(){viaCanvas(img)};
img.src=LOGO_URL})}

function toast(t,type,sub){type=type||'success';var el=document.createElement('div');el.className='toast t-'+type;
el.innerHTML='<span class="ti">'+ic({success:'circle-check',error:'circle-x',info:'info',warn:'triangle-alert'}[type])+'</span><div><b>'+t+'</b>'+(sub?'<span>'+sub+'</span>':'')+'</div>';
 $('#toasts').appendChild(el);icons();
var k=function(){el.classList.add('out');setTimeout(function(){el.remove()},240)};el.onclick=k;setTimeout(k,3600)}
function burst(x,y){var cols=['#16A15C','#0D63F2','#C4E8D2','#EFA83C'];
for(var i=0;i<14;i++){var s=document.createElement('span'),a=Math.random()*Math.PI*2,d=40+Math.random()*70;
s.style.cssText='position:fixed;width:9px;height:9px;border-radius:50%;pointer-events:none;z-index:250;left:'+x+'px;top:'+y+'px;background:'+cols[i%4]+';--dx:'+(Math.cos(a)*d)+'px;--dy:'+(Math.sin(a)*d-30)+'px;animation:sp .8s cubic-bezier(.15,.8,.4,1) forwards';
document.body.appendChild(s);(function(el){setTimeout(function(){el.remove()},850)})(s)}}
function sk(w,h,r){return '<span class="sk" style="display:block;width:'+(typeof w==='string'?w:w+'px')+';height:'+h+'px'+(r?';border-radius:'+r+'px':'')+'"></span>'}
function mountShell(route){
var bnavHtml=[['index','house','Home'],['earn','zap','Earn'],['wallet','wallet','Wallet'],['history','history','History'],['profile','user','Profile']].map(function(it){
return '<a href="'+it[0]+'.html" data-route="'+it[0]+'"><span class="bi">'+ic(it[1])+'</span>'+it[2]+'</a>'}).join('');
 $('#app').innerHTML=
'<header class="dhdr"><a class="brand" href="index.html"><span class="mark"><img id="brandLogo" src="'+logoSrc()+'" alt="Adward"></span>Adward</a><div class="grow"></div>'
+'<button class="ico-btn" id="hBell">'+ic('bell')+'<span class="badge-dot" id="bellBadge" style="display:none"></span></button>'
+'<button class="ico-btn" id="burger">'+ic('menu')+'</button></header>'
+'<div class="netban" id="netban">'+ic('cloud-off')+" You're offline — rewards will sync once you reconnect</div>"
+'<div class="dover" id="dover"></div><aside class="drawer" id="drawer"></aside>'
+'<main class="main" id="view"></main>'
+'<nav class="bnav">'+bnavHtml+'</nav>';
icons();
 $('#hBell').onclick=function(){location.href='notifications.html'};
var dr=$('#drawer'),ov=$('#dover');
 $('#burger').onclick=function(){fillDrawer();dr.classList.add('open');ov.classList.add('open');document.body.style.overflow='hidden'};
ov.onclick=closeDr;
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeDr()});
 $$('.bnav a[data-route]').forEach(function(a){a.classList.toggle('on',a.dataset.route===route)});
var up=function(){var b=$('#netban');if(b)b.style.display=navigator.onLine?'none':'flex'};
addEventListener('offline',function(){up()});addEventListener('online',function(){up()});up()}
function closeDr(){var dr=$('#drawer'),ov=$('#dover');
dr.classList.remove('open');ov.classList.remove('open');document.body.style.overflow=''}
function loadCache(){try{return JSON.parse(localStorage.getItem('earnly_dash_cache_v1'))||null}catch(e){}return null}
var navType=(performance.getEntriesByType('navigation')[0]||{}).type||'navigate';

var ME=(function(){var c=loadCache();return c?c.me:null})();

 /* logout → wipe auth + cached state → clean public boot (cache-buster) */

 $$('a',dr).forEach(function(a){a.addEventListener('click',closeDr)})}

mountShell('tasks');
/* LOGGED-OUT LOAD — purge stale flag + never restore a stale snapshot */
if(!localStorage.getItem(FLAG)||!localStorage.getItem('earnly_uid')){
purgeStaleAuth();
try{Object.keys(sessionStorage).forEach(function(k){if(k.indexOf('earnly_snap_')===0)sessionStorage.removeItem(k)})}catch(e){}
 $('#view').innerHTML=skelMain();icons()}
else{
var _snap=sessionStorage.getItem(snapKey);
if(_snap){$('#view').innerHTML=_snap;icons();bindView()}
else{$('#view').innerHTML=skelMain();icons()}}
cacheLogo();

function hideLoginSheet(){var b=$('#loginSheet');if(b)b.remove()}
/* ============ ASYNC PHASE ============ */
var firebaseConfig={apiKey:"AIzaSyDyntEXdOxJKaiqzU0p6gr8MNzAUqJ1dqE",authDomain:"earning-app-6d638.firebaseapp.com",projectId:"earning-app-6d638",storageBucket:"earning-app-6d638.firebasestorage.app",messagingSenderId:"813497830586",appId:"1:813497830586:web:8f728409eaaccd08c34683"};
firebase.initializeApp(firebaseConfig);
var auth=firebase.auth(),fs=firebase.firestore();
if(typeof fs.enableIndexedDbPersistence==='function'){fs.enableIndexedDbPersistence().catch(function(){})}
/* back-button / bfcache guard — signed-out restore gets a fresh load */
addEventListener('pageshow',function(e){
if(e.persisted&&(!localStorage.getItem(FLAG)||!localStorage.getItem('earnly_uid')))location.reload()});

/* fetch task list from Firestore: collection "tasks" */
function loadTasks(){
return fs.collection('tasks').get().then(function(q){
if(q.empty)return;
var list=[];
q.forEach(function(doc){
var c=doc.data()||{};
list.push({
id:doc.id,
title:typeof c.title==='string'&&c.title?c.title:'Task',
desc:typeof c.desc==='string'?c.desc:'',
reward:typeof c.reward==='number'?c.reward:0,
frequency:c.frequency==='once'?'once':'daily',
btnLabel:typeof c.btnLabel==='string'&&c.btnLabel?c.btnLabel:'Continue',
btnUrl:typeof c.btnUrl==='string'&&c.btnUrl?c.btnUrl:'',
img:typeof c.img==='string'?c.img:'',
icon:typeof c.icon==='string'&&c.icon?c.icon:'target',
order:typeof c.order==='number'?c.order:0})});
if(list.length){list.sort(function(a,b){return (a.order-b.order)||a.title.localeCompare(b.title)});TASKS_CONFIG=list}
}).catch(function(){})}

var UID=null,ME=null,LOGGED_IN=false;
function uRef(){return fs.collection('users').doc(UID)}
function snapK(){return 'earnly_snap_tasks_'+UID}
function saveME(){try{var old=JSON.parse(localStorage.getItem('earnly_dash_cache_v1')||'{}');old.uid=UID;old.me=ME;localStorage.setItem('earnly_dash_cache_v1',JSON.stringify(old))}catch(e){}}
function saveEARN(){try{var old=JSON.parse(localStorage.getItem('earnly_earn_cache_v1')||'{}');old.uid=UID;old.me=ME;localStorage.setItem('earnly_earn_cache_v1',JSON.stringify(old))}catch(e){}}
function S_BAL(){if(ME&&ME.balance){saveME();saveEARN()}}

/* ============ TASK BUTTON STATES ============ */
/* idle → (click) verifying → user returns:
   1s Verifying animation → reward credited → Complete */
function setBtn(b,state){
if(!b)return;
var label=b.getAttribute('data-label')||'Open';
if(state==='verifying'){b.disabled=true;b.className='btn btn-primary btn-sm';b.innerHTML='<span class="spinner"></span> Verifying…'}
else{b.disabled=false;b.className='btn btn-primary btn-sm';b.textContent=label}}

/* pending visit — survives the tab switch (and a reload) */
var taskPending=null;
try{var _tp=sessionStorage.getItem('tk_pending');if(_tp)taskPending=JSON.parse(_tp)}catch(e){}
function saveTaskPending(){try{if(taskPending)sessionStorage.setItem('tk_pending',JSON.stringify(taskPending));else sessionStorage.removeItem('tk_pending')}catch(e){}}

function startTask(t,btn){
if(!LOGGED_IN){showLoginSheet();return}
if(taskPending){toast('Task in progress','info','Finish the open task first');return}
if(!t.btnUrl){toast('No link set','warn','This task has no action URL yet');return}
var w=window.open(t.btnUrl,'_blank');
if(!w){toast('Pop-up blocked','warn','Allow pop-ups for this site, then try again');return}
taskPending={id:t.id,at:Date.now(),reward:t.reward};
saveTaskPending();
setBtn(btn,'verifying')}

function settleTask(){
if(!taskPending)return;
var p=taskPending;taskPending=null;saveTaskPending();
var btn=$('[data-task="'+p.id+'"]');
/* success → toast amount, Verifying for 1 second, then credit.
   No minimum wait — every return completes the task. */
toast('+'+money(p.reward)+' added to your account','success','Task completed — reward credited automatically');
if(btn)setBtn(btn,'verifying');
var minShow=new Promise(function(res){setTimeout(res,1000)}); /* 1s Verifying animation */
Promise.all([
taskClaimVisit(p.id).catch(function(err){
if(btn)setBtn(btn,'idle');
toast(err.message||'Could not credit the reward','error');
return null}),
minShow
]).then(function(res){
if(res[0]===null)return;
S_BAL();
if(btn){var r=btn.getBoundingClientRect();burst(r.left+r.width/2,r.top)}
render()})}

document.addEventListener('visibilitychange',function(){
if(document.visibilityState==='visible')settleTask()});
window.addEventListener('focus',settleTask);

/* SERVER: credit task reward after the visit.
   Atomic — frequency 'daily' once/day, 'once' forever.
   Updates BOTH balance.available AND balance.earned,
   so task earnings count toward the referral ৳100 threshold. */
function taskClaimVisit(id){
return fs.runTransaction(function(t){
/* 1. READ */
return t.get(uRef()).then(function(snap){
if(!snap.exists)throw{message:'Account not found'};
var p=snap.data(),d=normDaily(p.daily);
var task=null;TASKS_CONFIG.forEach(function(x){if(x.id===id)task=x});
if(!task)throw{message:'Task not found'};
/* frequency check */
if(task.frequency==='once'){
if((p.tasksClaimedOnce||[]).indexOf(id)>=0)throw{message:'This task was already completed'}}
else{
if((d.tasksClaimed||[]).indexOf(id)>=0)throw{message:'Task already completed today'}}
/* 2. CALCULATE */
if(task.frequency==='once'){
p.tasksClaimedOnce=(p.tasksClaimedOnce||[]).concat([id])}
else{
d.tasksClaimed=(d.tasksClaimed||[]).concat([id])}
p.balance=p.balance||{available:0,pending:0,earned:0,withdrawn:0};
p.balance.available=round2((p.balance.available||0)+task.reward);
p.balance.earned=round2((p.balance.earned||0)+task.reward);
d.todayEarned=round2((d.todayEarned||0)+task.reward);
/* 3. WRITES LAST */
var upd={balance:p.balance,daily:d};
if(task.frequency==='once')upd.tasksClaimedOnce=p.tasksClaimedOnce;
t.update(uRef(),upd);
var tid='TXN-'+rid(8);
t.set(uRef().collection('txns').doc(tid),{id:tid,at:Date.now(),status:'completed',type:'task',
title:'Task reward · '+task.title,amount:task.reward});
t.set(uRef().collection('notifs').doc(),{at:Date.now(),read:false,kind:'reward',icon:'target',
title:'Task reward received',body:money(task.reward)+' for \u201c'+task.title+'\u201d has been added to your balance.'});
ME=p;ME.daily=d;saveME();
return task.reward})})}

function computeTasks(){
var d=normDaily(ME.daily);
var onceArr=ME.tasksClaimedOnce||[];
return TASKS_CONFIG.map(function(t){
var claimed=t.frequency==='once'?onceArr.indexOf(t.id)>=0:(d.tasksClaimed||[]).indexOf(t.id)>=0;
return{id:t.id,icon:t.icon,title:t.title,desc:t.desc,reward:t.reward,
frequency:t.frequency,btnLabel:t.btnLabel,btnUrl:t.btnUrl,img:t.img,claimed:claimed}})}

function bindView(){
 $$('[data-task]').forEach(function(b){
if(b.dataset.bound)return;b.dataset.bound='1';
b.addEventListener('click',function(){
if(b.disabled)return;
var id=b.getAttribute('data-task'),t=null;
TASKS_CONFIG.forEach(function(x){if(x.id===id)t=x});
if(t)startTask(t,b)})})}

function render(){
var tasks=computeTasks();
var sy=window.scrollY;
 $('#view').innerHTML='<div class="phead ptitle"><h1>Daily Tasks</h1><p>Open a task link — the reward is credited automatically when you return.</p></div>'
+tasks.map(function(t){
var media=t.img
?'<span class="taskimg"><img src="'+esc(t.img)+'" alt="" loading="lazy"></span>'
:'<span class="tint tint-green">'+ic(esc(t.icon))+'</span>';
var right;
if(t.claimed){
right='<span class="chip chip-mint">'+ic('check')+' Complete</span>'}
else if(taskPending&&taskPending.id===t.id){
right='<button class="btn btn-primary btn-sm" disabled><span class="spinner"></span> Verifying…</button>'}
else{
right='<button class="btn btn-primary btn-sm" data-task="'+esc(t.id)+'" data-label="'+esc(t.btnLabel)+'">'+esc(t.btnLabel)+'</button>'}
return '<div class="task-row">'+media
+'<div class="tk-body"><h4>'+esc(t.title)+'</h4><p>'+esc(t.desc)+'</p></div>'
+'<div class="tk-side"><span class="chip chip-mint">'+money(t.reward)+'</span>'
+(t.frequency==='once'?'<span class="chip">'+ic('bookmark')+' One-time</span>':'')
+right
+'</div></div>'}).join('')
+'<div class="note">'+ic('clock')+'<span>Rewards are credited automatically when you return from the task link. Daily tasks reset at midnight; one-time tasks can be completed only once.</span></div>';
icons();
window.scrollTo(0,sy);
bindView();
try{sessionStorage.setItem(snapK(),$('#view').innerHTML)}catch(e){}}

var sawUser=false,handled=false;
auth.onAuthStateChanged(function(u){
if(!u){
if(sawUser){
try{localStorage.removeItem(FLAG);localStorage.removeItem('earnly_uid');
localStorage.removeItem('earnly_dash_cache_v1');localStorage.removeItem('earnly_earn_cache_v1');
sessionStorage.clear()}catch(e){}
location.replace('index.html?out='+Date.now());return}
purgeStaleAuth();
showLoginSheet();return}
if(handled)return;handled=true;sawUser=true;
LOGGED_IN=true;
hideLoginSheet();
UID=u.uid;localStorage.setItem('earnly_uid',UID);localStorage.setItem(FLAG,'1');
if(!ME){var c=loadCache();if(c&&c.me)ME=c.me}
if(!ME){location.replace('index.html');return}
/* fetch user profile AND task list in parallel, then render */
Promise.all([
uRef().get().catch(function(){return null}),
loadTasks()
]).then(function(res){
var snap=res[0];
if(snap&&snap.exists){ME=snap.data();saveME();saveEARN()}
render();
/* reload while a task visit was open → settle it now */
if(taskPending&&document.visibilityState==='visible')settleTask()}).catch(function(){render()})});
</script>
