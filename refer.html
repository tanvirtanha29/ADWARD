<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Refer &amp; Earn — Adward</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="%230D63F2"/><path d="M13 2 4.5 13.5H11L10 22l8.5-11.5H12L13 2z" fill="white"/></svg>'>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#F6F8F7;--line:#E6ECE8;--line2:#EEF2F0;--ink:#101A14;--ink2:#57645C;--ink3:#94A29A;--mint:#E9F7EE;--mint2:#D9F0E2;--mint3:#C4E8D2;--green:#16A15C;--green-d:#0B7B44;--blue:#0D63F2;--blue-d:#0A52CC;--blue-s:#EBF2FE;--amber:#B25E09;--amber-s:#FDF1DF;--red:#D92D20;--red-s:#FCEBEB;--sh-sm:0 1px 2px rgba(16,24,40,.05);--sh-md:0 8px 24px rgba(16,24,40,.08);--font:'Plus Jakarta Sans',sans-serif;--num:'Sora',sans-serif;--brand:'Space Grotesk','Sora',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration:none}button{font-family:var(--font)}
.grow{flex:1}.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh-sm)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14.5px;border:1px solid transparent;border-radius:12px;height:46px;padding:0 20px;cursor:pointer;transition:.18s;background:none;color:var(--ink);white-space:nowrap}
.btn svg{width:17px;height:17px}.btn:active{transform:scale(.975)}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:var(--blue-d)}
.btn-ghost{background:#fff;border-color:var(--line)}
.btn-sm{height:37px;padding:0 15px;font-size:13.5px;border-radius:10px}
.btn-block{width:100%}
.chip{display:inline-flex;align-items:center;gap:5px;background:#F2F6F3;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;color:var(--ink2);white-space:nowrap}
.chip svg{width:12px;height:12px}.chip-mint{background:var(--mint);color:var(--green-d)}
.tint{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}.tint svg{width:19px;height:19px}
.tint-green{background:var(--mint);color:var(--green-d)}.tint-amber{background:var(--amber-s);color:var(--amber)}.tint-ink{background:#F2F6F3;color:var(--ink2)}
.ico-btn{position:relative;width:40px;height:40px;border-radius:12px;border:none;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink)}.ico-btn:hover{background:var(--line2)}.ico-btn svg{width:21px;height:21px}
.badge-dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;background:var(--red);color:#fff;border-radius:999px;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px;border:2px solid #fff}
.avatar{border-radius:50%;background:var(--mint);border:1px solid var(--mint3);color:var(--green-d);display:grid;place-items:center;font:800 13px var(--num);flex:none}
.dhdr{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line2);height:60px;display:flex;align-items:center;gap:8px;padding:0 16px}
/* Site name in Space Grotesk — same brand style as the dashboard */
.brand{display:flex;align-items:center;gap:9px;color:var(--ink);font:800 17px var(--brand)}
/* Mark 37×37, image fills it; header height stays exactly 60px */
.brand .mark{width:37px;height:37px;border-radius:11px;background:var(--blue);color:#fff;display:grid;place-items:center;overflow:hidden;flex:none}
.brand .mark img{width:100%;height:100%;object-fit:cover;display:block}
.dover{position:fixed;inset:0;background:rgba(16,26,20,.42);opacity:0;visibility:hidden;transition:.22s;z-index:90}.dover.open{opacity:1;visibility:visible}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(216px,56vw);background:#fff;z-index:95;transform:translateX(105%);transition:transform .3s cubic-bezier(.2,.8,.3,1);display:flex;flex-direction:column;border-left:1px solid var(--line2);padding:16px 10px calc(16px + env(safe-area-inset-bottom));overflow-y:auto}.drawer.open{transform:none}
.dprof{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;border-bottom:1px solid var(--line2);margin-bottom:6px}.dprof b{display:block;font-size:14px}.dprof span{font:700 12px var(--num);color:var(--green-d)}
.sgroup{font-size:10px;font-weight:800;letter-spacing:1px;color:var(--ink3);text-transform:uppercase;padding:12px 10px 6px}
.slink{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:11px;color:var(--ink2);font-size:13.5px;font-weight:600;border:none;background:none;width:100%;text-align:left;cursor:pointer;text-decoration:none}.slink svg{width:17px;height:17px;flex:none}.slink:hover{background:#F4F8F5;color:var(--ink)}.slink.on{background:var(--blue-s);color:var(--blue)}
.dfoot{margin-top:auto;border-top:1px solid var(--line2);padding-top:10px}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line2);display:flex;padding:5px 6px calc(5px + env(safe-area-inset-bottom))}
.bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0 3px;color:var(--ink3);font-size:10.5px;font-weight:700;text-decoration:none}
.bnav .bi{display:flex;padding:5px 16px;border-radius:999px;transition:background .18s}
.bnav svg{width:20px;height:20px}.bnav a.on{color:var(--blue)}.bnav a.on .bi{background:var(--blue-s)}
.netban{position:sticky;top:60px;z-index:39;background:var(--amber-s);color:var(--amber);font-size:13px;font-weight:700;display:none;align-items:center;justify-content:center;gap:8px;padding:8px 14px}.netban svg{width:15px;height:15px}
.main{max-width:680px;margin:0 auto;padding:18px 16px calc(96px + env(safe-area-inset-bottom))}
@media(min-width:1024px){.main{max-width:1020px;padding:28px 32px 80px}}
.phead{margin-bottom:18px}.ptitle h1{font:800 22px/1.25 var(--num)}.ptitle p{color:var(--ink2);font-size:14px;margin-top:4px}
.sec{margin-top:26px}.sech{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.sech h2{font-size:16px;font-weight:800}
.refhero{background:var(--mint);border:1px solid var(--mint3);border-radius:20px;padding:22px 20px}
.refsteps{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.refstep{display:flex;gap:11px;align-items:center;font-size:13.5px;font-weight:600;color:var(--ink)}
.refstep i{width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;font:800 12px var(--num);display:grid;place-items:center;font-style:normal;flex:none}
.codebox{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#F8FAF9;border:1.5px dashed var(--mint3);border-radius:14px;padding:13px 15px}
.codebox b{font:800 19px var(--num);letter-spacing:2.5px}
.linkbox{display:flex;align-items:center;gap:9px;background:#F8FAF9;border:1px solid var(--line);border-radius:12px;padding:9px 9px 9px 14px;margin-top:10px}
.linkbox span{flex:1;font-size:12.5px;color:var(--ink2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat4{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
@media(min-width:640px){.stat4{grid-template-columns:repeat(4,1fr)}}
.stat4 .card{padding:15px}
.stat4 small{font-size:12px;font-weight:700;color:var(--ink2);display:block}
.stat4 b{font:700 19px var(--num);font-variant-numeric:tabular-nums}
.trow{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line2)}.trow:last-child{border:none}
.tinfo{flex:1;min-width:0}
.tinfo .t1{font-size:14px;font-weight:700}.tinfo .t2{font-size:12px;color:var(--ink3);font-weight:500;margin-top:1px}
.tright{text-align:right;flex:none}.tamt{font:700 14.5px var(--num);font-variant-numeric:tabular-nums;color:var(--green-d)}
.st{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;margin-top:3px}
.st-completed{background:var(--mint);color:var(--green-d)}
.st-pending{background:var(--amber-s);color:var(--amber)}
.note{display:flex;gap:11px;padding:13px 15px;background:var(--mint);border:1px solid var(--mint3);border-radius:14px;font-size:13px;color:var(--ink2);font-weight:500;margin-top:16px}
.note svg{width:17px;height:17px;color:var(--green-d);flex:none;margin-top:1px}
.empty{padding:44px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.eico{width:60px;height:60px;border-radius:50%;background:var(--mint);color:var(--green-d);display:grid;place-items:center;margin-bottom:8px}.eico svg{width:26px;height:26px}
.empty h3{font-size:16.5px;font-weight:800}.empty p{color:var(--ink2);font-size:14px;max-width:320px}
.empty .btn{margin-top:14px}
.sk{background:#E7EEE9;border-radius:10px;position:relative;overflow:hidden}
.sk::after{content:'';position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:shim 1.4s infinite}
@keyframes shim{to{transform:translateX(100%)}}
.sheet-back{position:fixed;inset:0;background:rgba(16,26,20,.55);z-index:150;display:flex;align-items:flex-end;justify-content:center;animation:fade .25s;backdrop-filter:blur(3px)}
@keyframes fade{from{opacity:0}}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:26px 22px calc(26px + env(safe-area-inset-bottom));animation:mup .35s;text-align:center}
@keyframes mup{from{transform:translateY(60px);opacity:0}}
.sheet .grip{width:44px;height:5px;border-radius:99px;background:var(--line2);margin:0 auto 18px}
.sheet .slogo{width:54px;height:54px;border-radius:16px;background:var(--blue);color:#fff;display:grid;place-items:center;margin:0 auto 14px;overflow:hidden;flex:none}
.sheet .slogo img{width:100%;height:100%;object-fit:cover;display:block}
.sheet .slogo svg{width:26px;height:26px}
.sheet h2{font:800 20px var(--num);margin-bottom:6px}
.sheet p{color:var(--ink2);font-size:13.5px;font-weight:500;margin-bottom:20px}
.sheet .acts{display:flex;gap:10px}
.sheet .acts .btn{flex:1;height:48px}
.sheet small{display:block;margin-top:14px;color:var(--ink3);font-size:12px;font-weight:600}
#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;width:min(92vw,390px);pointer-events:none}
.toast{pointer-events:auto;display:flex;gap:11px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--sh-md);animation:tin .3s;cursor:pointer}
.toast.out{animation:tout .25s forwards}
@keyframes tin{from{opacity:0;transform:translateY(-14px) scale(.96)}}
@keyframes tout{to{opacity:0;transform:translateY(-10px) scale(.97)}}
.toast .ti{width:27px;height:27px;border-radius:9px;display:grid;place-items:center;flex:none}.toast .ti svg{width:15px;height:15px}
.toast.t-success .ti{background:var(--mint);color:var(--green-d)}.toast.t-error .ti{background:var(--red-s);color:var(--red)}
.toast.t-info .ti{background:var(--blue-s);color:var(--blue)}
.toast b{display:block;font-size:13.5px}.toast span{display:block;font-size:12.5px;color:var(--ink2);margin-top:1px}
/* ===== FIX: remove Android/WebView tap highlight + tap focus ring ONLY ===== */
*{-webkit-tap-highlight-color:transparent !important}
a,button,[role="button"],[onclick],.bnav a,.bnav .bi,.ico-btn,.slink,.btn,.card,.toast,.dover{-webkit-tap-highlight-color:transparent !important}
a:focus:not(:focus-visible),button:focus:not(:focus-visible),.bnav a:focus:not(:focus-visible),.bnav .bi:focus:not(:focus-visible),.ico-btn:focus:not(:focus-visible),.slink:focus:not(:focus-visible),.btn:focus:not(:focus-visible),.toast:focus:not(:focus-visible){outline:none !important}
/* fallback for very old Android WebView without :focus-visible (touch devices only) */
@media (hover:none) and (pointer:coarse){a:focus,button:focus,.bnav a:focus,.bnav .bi:focus,.ico-btn:focus,.slink:focus,.btn:focus,.toast:focus{outline:none !important}}
</style>
</head>
<body>
<div id="toasts"></div>
<div id="app"></div>
<script>
/* ============ SYNC PHASE ============ */
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return [].slice.call((r||document).querySelectorAll(s))}
function icons(){if(window.lucide)lucide.createIcons()}
function ic(n){return '<i data-lucide="'+n+'"></i>'}
function money(n){return '৳'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function money0(n){return '৳'+Number(n||0).toLocaleString('en-US')}
function round2(v){return Math.round(v*100)/100}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function firstName(n){var p=String(n||'').trim().split(/\s+/);return p[0]||'User'}
function rid(n){var s='',c='ABCDEFGHJKMNPQRSTUVWXYZ23456789';while(n--)s+=c[Math.random()*31|0];return s}
function initials(n){return (n||'').trim().split(/\s+/).map(function(w){return w[0]}).slice(0,2).join('').toUpperCase()}
var FLAG='earnly_logged_in';
/* ONLY the referrer earns — new users get no signup bonus, referred or not.
   REF_FRIEND was removed: the ৳20 was never paid in code and is no longer advertised. */
var REF_BONUS=50,REF_MIN_EARN=100;
var MONS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtD(t){var d=new Date(t);return d.getDate()+' '+MONS[d.getMonth()]+' '+d.getFullYear()}
function tsMs(t){if(!t)return Date.now();if(typeof t.toMillis==='function')return t.toMillis();if(t&&t.seconds)return t.seconds*1000;var d=new Date(t);return isNaN(d.getTime())?Date.now():d.getTime()}
/* The app's legitimate TOTAL EARNED field is balance.earned (dashboard
   "Total earned" stat reads the same). Never balance/withdrawn/pending.
   Referral rewards never touch balance.earned, so this stays pure. */
function getTotalEarned(u){
if(!u||typeof u!=='object')return 0;
if(u.balance&&typeof u.balance.earned==='number')return u.balance.earned;
var K=['totalEarned','total_earned','lifetimeEarned','earnedTotal','totalEarning','total_earning','lifetime_earned'];
for(var i=0;i<K.length;i++){var v=u[K[i]];if(typeof v==='number')return v}
if(u.stats&&typeof u.stats.totalEarned==='number')return u.stats.totalEarned;
return 0}

/* ================== SITE LOGO (auto-invalidating cache) ==================
   Same shared cache as dashboard/earn/checkin (earnly_site_logo_v2). */
var LOGO_URL='https://i.ibb.co.com/7J62W1Vy/super-resolution-20260902102855933.png';
var LOGO_KEY='earnly_site_logo_v2';
var LOGO_LEGACY_KEYS=['earnly_watch_ad_logo_v1'];
function logoGet(){
try{
var raw=localStorage.getItem(LOGO_KEY);
if(!raw)return '';
var o=JSON.parse(raw);
if(!o||o.url!==LOGO_URL||!o.data)return '';
return o.data}catch(e){return ''}}
function logoSrc(){return logoGet()||LOGO_URL}
function updateLogoImg(){
var l=logoGet();if(!l)return;
var im=$('#brandLogo')||$('#sheetLogo');
if(im)im.src=l}
function cacheLogo(){
try{LOGO_LEGACY_KEYS.forEach(function(k){localStorage.removeItem(k)})}catch(e){}
if(logoGet())return;
var save=function(d){try{localStorage.setItem(LOGO_KEY,JSON.stringify({url:LOGO_URL,data:d}))}catch(e){}};
var viaCanvas=function(img){
try{
var w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
if(!w||!h)return;
var scale=Math.min(1,512/Math.max(w,h));
var c=document.createElement('canvas');
c.width=Math.max(1,Math.round(w*scale));
c.height=Math.max(1,Math.round(h*scale));
var cx=c.getContext('2d');
cx.imageSmoothingEnabled=true;cx.imageSmoothingQuality='high';
cx.drawImage(img,0,0,c.width,c.height);
save(c.toDataURL('image/png'));
updateLogoImg()}catch(e){}};
fetch(LOGO_URL,{mode:'cors'}).then(function(r){
if(!r.ok)throw new Error('http '+r.status);return r.blob()}).then(function(b){
return new Promise(function(res,rej){
var fr=new FileReader();fr.onload=function(){res(fr.result)};fr.onerror=rej;fr.readAsDataURL(b)})}).then(function(dataUrl){
if(dataUrl&&dataUrl.length<1200000){save(dataUrl);updateLogoImg();return}
var probe=new Image();
probe.onload=function(){viaCanvas(probe)};
probe.src=dataUrl}).catch(function(){
var img=new Image();img.crossOrigin='anonymous';
img.onload=function(){viaCanvas(img)};
img.src=LOGO_URL})}

var NAV=[
{g:'Overview',items:[['index','house','Dashboard'],['earn','zap','Earn Hub']]},
{g:'Earning',items:[['watch','play','Watch & Earn'],['scratch','gift','Scratch Card'],['tasks','target','Daily Tasks'],['checkin','calendar-check','Daily Check-In'],['spin','disc-3','Spin & Earn'],['offers','puzzle','Offers'],['refer','users','Refer & Earn']]},
{g:'Account',items:[['wallet','wallet','Wallet'],['withdraw','banknote','Withdraw'],['history','history','Transactions'],['notifications','bell','Notifications'],['profile','user','Profile']]}];
function sk(w,h,r){return '<span class="sk" style="display:block;width:'+w+'px;height:'+h+'px'+(r?';border-radius:'+r+'px':'')+'"></span>'}
function mountShell(route){
var bnavHtml=[['index','house','Home'],['earn','zap','Earn'],['wallet','wallet','Wallet'],['history','history','History'],['profile','user','Profile']].map(function(it){
return '<a href="'+it[0]+'.html" data-route="'+it[0]+'"><span class="bi">'+ic(it[1])+'</span>'+it[2]+'</a>'}).join('');
 $('#app').innerHTML=
'<header class="dhdr"><a class="brand" href="index.html"><span class="mark"><img id="brandLogo" src="'+logoSrc()+'" alt="Adward"></span>Adward</a><div class="grow"></div>'
+'<button class="ico-btn" id="hBell">'+ic('bell')+'<span class="badge-dot" id="bellBadge" style="display:none"></span></button>'
+'<button class="ico-btn" id="burger">'+ic('menu')+'</button></header>'
+'<div class="netban" id="netban">'+ic('cloud-off')+" You're offline — rewards will sync once you reconnect</div>"
+'<div class="dover" id="dover"></div><aside class="drawer" id="drawer"></aside>'
+'<main class="main" id="view"></main>'
+'<nav class="bnav">'+bnavHtml+'</nav>';
icons();
 $('#hBell').onclick=function(){location.href='notifications.html'};
var dr=$('#drawer'),ov=$('#dover');
 $('#burger').onclick=function(){fillDrawer();dr.classList.add('open');ov.classList.add('open');document.body.style.overflow='hidden'};
ov.onclick=closeDr;
 $$('.bnav a[data-route]').forEach(function(a){a.classList.toggle('on',a.dataset.route===route)});
var up=function(){var b=$('#netban');if(b)b.style.display=navigator.onLine?'none':'flex'};
addEventListener('offline',function(){up()});addEventListener('online',function(){up()});up()}
function closeDr(){var dr=$('#drawer'),ov=$('#dover');
dr.classList.remove('open');ov.classList.remove('open');document.body.style.overflow=''}
function loadCache(){try{return JSON.parse(localStorage.getItem('earnly_dash_cache_v1'))||null}catch(e){}return null}
var navType=(performance.getEntriesByType('navigation')[0]||{}).type||'navigate';
var snapKey='earnly_snap_refer_'+(localStorage.getItem('earnly_uid')||'anon');
if(navType==='reload'){sessionStorage.removeItem(snapKey);sessionStorage.removeItem('sc_refer')}
var ME=(function(){var c=loadCache();return c?c.me:null})();
var UNREAD=(function(){var c=loadCache();return c?(c.unread||0):0})();
function refreshHeader(){var bd=$('#bellBadge');if(bd){bd.style.display=UNREAD?'grid':'none';bd.textContent=UNREAD>9?'9+':UNREAD}}
function drawerHtml(){
return '<div class="dprof"><span class="avatar" style="width:42px;height:42px;font-size:14px">'+initials(ME.name)+'</span>'
+'<div><b>'+esc(ME.name)+'</b><span>'+(ME.balance?money(ME.balance.available):'')+'</span></div></div>'
+NAV.map(function(g){return '<div class="sgroup">'+g.g+'</div>'+g.items.map(function(it){
return '<a class="slink" data-route="'+it[0]+'" href="'+it[0]+'.html">'+ic(it[1])+it[2]+'</a>'}).join('')}).join('')
+'<div class="dfoot"><button class="slink" id="drOut" style="color:var(--red)">'+ic('log-out')+'Log out</button></div>'}
function fillDrawer(){
var dr=$('#drawer');

/* ===== REFERRAL ENGINE — atomic, one-time reward payment =====
   Reads BEFORE writes; every condition re-checked INSIDE the
   transaction, so the ৳50 can NEVER be paid twice (refresh /
   multiple tabs / listeners firing again). Uses the existing
   referredBy field. Deterministic txn ID referral_{uid}. */
function payReferralReward(refUid,entryUid){
var FV=firebase.firestore.FieldValue;
var bRef=fs.collection('users').doc(entryUid);
var aRef=fs.collection('users').doc(refUid);
var tRef=fs.collection('users').doc(refUid).collection('txns').doc('referral_'+entryUid);
return fs.runTransaction(function(t){
return t.get(bRef).then(function(bs){
if(!bs.exists)return 'skip';
var b=bs.data();
if(b.referredBy!==refUid&&b.referrerId!==refUid)return 'skip';      /* not our referral */
if(b.referralRewardPaid===true||b.referralStatus==='valid')return 'skip'; /* already paid — permanent */
if(getTotalEarned(b)<REF_MIN_EARN)return 'skip';                    /* not qualified yet */
return t.get(aRef).then(function(as){
var a=as.exists?as.data():{};
var refs=Array.isArray(a.refs)?a.refs.slice():[];
var idx=-1,i;
for(i=0;i<refs.length;i++){if(refs[i]&&refs[i].uid===entryUid){idx=i;break}}
var earnedNow=getTotalEarned(b);
/* 1) referred user: permanent valid + paid flags */
t.update(bRef,{referralStatus:'valid',referralRewardPaid:true,refValidatedAt:Date.now()});
/* 2) referrer txn — deterministic ID, same shape as app txns */
t.set(tRef,{id:'referral_'+entryUid,at:Date.now(),status:'completed',type:'referral',title:'Referral bonus · '+firstName(b.name),amount:REF_BONUS,fromUid:entryUid});
/* 3) notification to referrer (same format as app notifs) */
t.set(aRef.collection('notifs').doc(),{at:Date.now(),read:false,kind:'reward',icon:'users',title:'Referral reward unlocked',body:firstName(b.name)+' reached '+money0(REF_MIN_EARN)+' total earnings — your '+money0(REF_BONUS)+' bonus is now in your balance.'});
/* 4) referrer counters + legacy refs entry + balance credit.
      balance.earned is NOT touched — it stays pure activity earnings. */
var au={refValid:(Number(a.refValid)||0)+1,refEarned:round2((Number(a.refEarned)||0)+REF_BONUS)};
if(idx>-1){refs[idx]=Object.assign({},refs[idx],{uid:entryUid,status:'done',earned:earnedNow});au.refs=refs}
else{au.refs=FV.arrayUnion({uid:entryUid,name:firstName(b.name),at:Date.now(),status:'done',earned:earnedNow})}
au['balance.available']=round2((a.balance&&typeof a.balance.available==='number'?a.balance.available:0)+REF_BONUS);
t.update(aRef,au);
return 'paid'})})})}

.then(function(){delete validating[r.uid]})})}
