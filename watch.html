<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Watch &amp; Earn — Adward</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="%230D63F2"/><path d="M13 2 4.5 13.5H11L10 22l8.5-11.5H12L13 2z" fill="white"/></svg>'>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#F6F8F7;--line:#E6ECE8;--line2:#EEF2F0;--ink:#101A14;--ink2:#57645C;--ink3:#94A29A;--mint:#E9F7EE;--mint2:#D9F0E2;--mint3:#C4E8D2;--green:#16A15C;--green-d:#0B7B44;--blue:#0D63F2;--blue-d:#0A52CC;--blue-s:#EBF2FE;--amber:#B25E09;--amber-s:#FDF1DF;--red:#D92D20;--red-s:#FCEBEB;--sh-sm:0 1px 2px rgba(16,24,40,.05);--sh-md:0 8px 24px rgba(16,24,40,.08);--font:'Plus Jakarta Sans',sans-serif;--num:'Sora',sans-serif;--brand:'Space Grotesk','Sora',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration:none}button{font-family:var(--font)}
.grow{flex:1}.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh-sm)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14.5px;border:1px solid transparent;border-radius:12px;height:46px;padding:0 20px;cursor:pointer;transition:.18s;background:none;color:var(--ink)}
.btn svg{width:17px;height:17px}.btn:active{transform:scale(.975)}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:var(--blue-d)}
.btn-ghost{background:#fff;border-color:var(--line)}
.btn-block{width:100%;height:50px;font-size:15px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
/* ===== WATCH BUTTON STATES (counter / verifying / failed / time-met) ===== */
.spinner{width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;display:inline-block;animation:rot .7s linear infinite;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes wdotp{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.75)}}
.wdot{width:9px;height:9px;border-radius:50%;background:#fff;display:inline-block;flex:none;animation:wdotp 1.1s ease-in-out infinite}
/* live counter state — pulsing white dot on the blue button */
.btn-counting{background:var(--blue);color:#fff;font-variant-numeric:tabular-nums}
/* time met — mint, inviting the user back */
.btn-met{background:var(--mint);border-color:var(--mint3);color:var(--green-d)}
.btn-met .wdot{background:var(--green)}
/* verifying — stays blue with white spinner */
/* failed — red pill, same style as tasks page */
.btn-fail{background:var(--red-s);border-color:#F3C6C3;color:var(--red)}
.chip{display:inline-flex;align-items:center;gap:5px;background:#F2F6F3;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;color:var(--ink2);white-space:nowrap}
.chip svg{width:12px;height:12px}.chip-mint{background:var(--mint);color:var(--green-d)}
.ico-btn{position:relative;width:40px;height:40px;border-radius:12px;border:none;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink)}.ico-btn:hover{background:var(--line2)}.ico-btn svg{width:21px;height:21px}
.dhdr{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line2);height:60px;display:flex;align-items:center;gap:8px;padding:0 16px}
/* Site name in Space Grotesk — same brand style as the dashboard */
.brand{display:flex;align-items:center;gap:9px;color:var(--ink);font:800 17px var(--brand)}
/* Mark 37×37, image fills it; header height stays exactly 60px */
.brand .mark{width:37px;height:37px;border-radius:11px;background:var(--blue);color:#fff;display:grid;place-items:center;overflow:hidden;flex:none}
.brand .mark img{width:100%;height:100%;object-fit:cover;display:block}
.dover{position:fixed;inset:0;background:rgba(16,26,20,.42);opacity:0;visibility:hidden;transition:.22s;z-index:90}.dover.open{opacity:1;visibility:visible}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(216px,56vw);background:#fff;z-index:95;transform:translateX(105%);transition:transform .3s cubic-bezier(.2,.8,.3,1);display:flex;flex-direction:column;border-left:1px solid var(--line2);padding:16px 10px calc(16px + env(safe-area-inset-bottom));overflow-y:auto}.drawer.open{transform:none}
.dprof{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;border-bottom:1px solid var(--line2);margin-bottom:6px}.dprof b{display:block;font-size:14px}.dprof span{font:700 12px var(--num);color:var(--green-d)}
.avatar{border-radius:50%;background:var(--mint2);color:var(--green-d);display:inline-flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.sgroup{font-size:10px;font-weight:800;letter-spacing:1px;color:var(--ink3);text-transform:uppercase;padding:12px 10px 6px}
.slink{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:11px;color:var(--ink2);font-size:13.5px;font-weight:600;border:none;background:none;width:100%;text-align:left;cursor:pointer;text-decoration:none}.slink svg{width:17px;height:17px;flex:none}.slink:hover{background:var(--line2);color:var(--ink)}
.dfoot{margin-top:auto;border-top:1px solid var(--line2);padding-top:10px}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line2);display:flex;padding:5px 6px calc(5px + env(safe-area-inset-bottom))}
.bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0 3px;color:var(--ink3);font-size:10.5px;font-weight:700;text-decoration:none}
.bnav .bi{display:flex;padding:5px 16px;border-radius:999px;transition:background .18s}
.bnav svg{width:20px;height:20px}.bnav a.on{color:var(--blue)}.bnav a.on .bi{background:var(--blue-s)}
.netban{position:sticky;top:60px;z-index:39;background:var(--amber-s);color:var(--amber);font-size:13px;font-weight:700;display:none;align-items:center;justify-content:center;gap:8px;padding:8px 14px}.netban svg{width:15px;height:15px}
.main{max-width:680px;margin:0 auto;padding:18px 16px calc(96px + env(safe-area-inset-bottom))}
@media(min-width:1024px){.main{max-width:1020px;padding:28px 32px 80px}}
.phead{margin-bottom:18px}.ptitle h1{font:800 22px/1.25 var(--num)}.ptitle p{color:var(--ink2);font-size:14px;margin-top:4px}
/* ===== SINGLE WATCH-AD CARD ===== */
.adcard{padding:30px 20px 22px;text-align:center}
/* Fixed container: dimensions locked, never affected by the image.
   --logo controls ONLY the image zoom inside the box.
   Image is position:absolute (out of the layout flow), so changing
   --logo can never resize, stretch, or push the container. */
.adicon{--logo:80px;position:relative;width:72px;height:72px;border-radius:20px;background:var(--blue-s);overflow:hidden;display:inline-flex;justify-content:center;align-items:center;margin-bottom:14px;flex:none;min-width:72px;max-width:72px;min-height:72px;max-height:72px}
.adicon img{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:var(--logo);height:var(--logo);max-width:none;max-height:none;object-fit:contain;display:block;pointer-events:none}
.adcard h3{font:800 20px var(--num);margin:0 0 12px}
.vmeta{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.adsub{color:var(--ink2);font-size:13.5px;font-weight:500;max-width:430px;margin:0 auto 18px}
.note{display:flex;gap:11px;padding:13px 15px;background:var(--blue-s);border:1px solid #D6E6FF;border-radius:14px;font-size:13px;color:var(--ink2);font-weight:500;margin-top:16px}
.note svg{width:17px;height:17px;color:var(--blue);flex:none;margin-top:1px}
.sk{background:#E7EEE9;border-radius:10px;position:relative;overflow:hidden}
.sk::after{content:'';position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:shim 1.4s infinite}
@keyframes shim{to{transform:translateX(100%)}}
/* ===== LOGIN SHEET ===== */
.sheet-back{position:fixed;inset:0;background:rgba(16,26,20,.55);z-index:150;display:flex;align-items:flex-end;justify-content:center;animation:fade .25s;backdrop-filter:blur(3px)}
@keyframes fade{from{opacity:0}}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:26px 22px calc(26px + env(safe-area-inset-bottom));animation:mup .35s cubic-bezier(.2,.9,.3,1);text-align:center}
@keyframes mup{from{transform:translateY(60px);opacity:0}}
.sheet .grip{width:44px;height:5px;border-radius:99px;background:var(--line2);margin:0 auto 18px}
.sheet .slogo{width:54px;height:54px;border-radius:16px;background:var(--blue);color:#fff;display:grid;place-items:center;margin:0 auto 14px;overflow:hidden;flex:none}
.sheet .slogo img{width:100%;height:100%;object-fit:cover;display:block}
.sheet .slogo svg{width:26px;height:26px}
.sheet h2{font:800 20px var(--num);margin-bottom:6px}
.sheet p{color:var(--ink2);font-size:13.5px;font-weight:500;margin-bottom:20px}
.sheet .acts{display:flex;gap:10px}
.sheet .acts .btn{flex:1;height:48px}
.sheet small{display:block;margin-top:14px;color:var(--ink3);font-size:12px;font-weight:600}
/* ===== TOASTS ===== */
#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;width:min(92vw,390px);pointer-events:none}
.toast{pointer-events:auto;display:flex;gap:11px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--sh-md);animation:tin .3s;cursor:pointer}
.toast.out{animation:tout .25s forwards}
@keyframes tin{from{opacity:0;transform:translateY(-14px) scale(.96)}}
@keyframes tout{to{opacity:0;transform:translateY(-10px) scale(.97)}}
.toast .ti{width:27px;height:27px;border-radius:9px;display:grid;place-items:center;flex:none}.toast .ti svg{width:15px;height:15px}
.toast.t-success .ti{background:var(--mint);color:var(--green-d)}.toast.t-error .ti{background:var(--red-s);color:var(--red)}
.toast.t-info .ti{background:var(--blue-s);color:var(--blue)}.toast.t-warn .ti{background:var(--amber-s);color:var(--amber)}
.toast b{display:block;font-size:13.5px}.toast span{display:block;font-size:12.5px;color:var(--ink2);margin-top:1px}
/* ===== FIX: remove Android/WebView tap highlight + tap focus ring ONLY ===== */
*{-webkit-tap-highlight-color:transparent !important}
a,button,[role="button"],[onclick],.bnav a,.bnav .bi,.ico-btn,.slink,.btn,.card,.toast,.dover{-webkit-tap-highlight-color:transparent !important}
a:focus:not(:focus-visible),button:focus:not(:focus-visible),.bnav a:focus:not(:focus-visible),.bnav .bi:focus:not(:focus-visible),.ico-btn:focus:not(:focus-visible),.slink:focus:not(:focus-visible),.btn:focus:not(:focus-visible),.toast:focus:not(:focus-visible){outline:none !important}
/* fallback for very old Android WebView without :focus-visible (touch devices only) */
@media (hover:none) and (pointer:coarse){a:focus,button:focus,.bnav a:focus,.bnav .bi:focus,.ico-btn:focus,.slink:focus,.btn:focus,.toast:focus{outline:none !important}}
</style>
</head>
<body>
<div id="toasts"></div>
<div id="app"></div>
<script>
/* ============ HELPERS ============ */
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return [].slice.call((r||document).querySelectorAll(s))}
function icons(){if(window.lucide)lucide.createIcons()}
function ic(n){return '<i data-lucide="'+n+'"></i>'}
function money(n){return '৳'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function money0(n){return '৳'+Number(n||0).toLocaleString('en-US')}
function initials(n){return (n||'').trim().split(/\s+/).map(function(w){return w[0]}).slice(0,2).join('').toUpperCase()}
var FLAG='earnly_logged_in';

/* ================== AD CONFIG (FIREBASE) ==================
   Values are fetched from Firestore on page load:

     collection: config   →   document: watch

   fields in that document:
     link       (string)  → Adsterra DIRECT LINK (https://...)
     reward     (number)  → ৳ earned per completed watch
     minSeconds (number)  → minimum seconds to stay on the ad tab
     daily      (number)  → watches allowed per day
                            0 = UNLIMITED (no limit)
========================================================== */
var AD_CONFIG={link:'',reward:2,minSeconds:15,daily:0};

/* ================== SITE LOGO (auto-invalidating cache) ==================
   • Same shared cache as dashboard/refer/withdraw/history
     (earnly_site_logo_v2) — one download serves every page.
   • Used for the header brand mark, the login sheet AND the
     watch-ad tile.
========================================================================== */
var LOGO_URL='https://i.ibb.co.com/7J62W1Vy/super-resolution-20260902102855933.png';
var LOGO_KEY='earnly_site_logo_v2';
var LOGO_LEGACY_KEYS=['earnly_watch_ad_logo_v1'];
function logoGet(){
try{
var raw=localStorage.getItem(LOGO_KEY);
if(!raw)return '';
var o=JSON.parse(raw);
if(!o||o.url!==LOGO_URL||!o.data)return '';
return o.data}catch(e){return ''}}
function logoSrc(){return logoGet()||LOGO_URL}
function updateLogoImg(){
var l=logoGet();if(!l)return;
var im=$('#brandLogo')||$('#sheetLogo')||$('#adLogoImg');
if(im)im.src=l;
var ad=$('#adLogoImg');if(ad)ad.src=l}
function cacheLogo(){
try{LOGO_LEGACY_KEYS.forEach(function(k){localStorage.removeItem(k)})}catch(e){}
if(logoGet())return;
var save=function(d){try{localStorage.setItem(LOGO_KEY,JSON.stringify({url:LOGO_URL,data:d}))}catch(e){}};
var viaCanvas=function(img){
try{
var w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
if(!w||!h)return;
var scale=Math.min(1,512/Math.max(w,h));
var c=document.createElement('canvas');
c.width=Math.max(1,Math.round(w*scale));
c.height=Math.max(1,Math.round(h*scale));
var cx=c.getContext('2d');
cx.imageSmoothingEnabled=true;cx.imageSmoothingQuality='high';
cx.drawImage(img,0,0,c.width,c.height);
save(c.toDataURL('image/png'));
updateLogoImg()}catch(e){}};
fetch(LOGO_URL,{mode:'cors'}).then(function(r){
if(!r.ok)throw new Error('http '+r.status);return r.blob()}).then(function(b){
return new Promise(function(res,rej){
var fr=new FileReader();fr.onload=function(){res(fr.result)};fr.onerror=rej;fr.readAsDataURL(b)})}).then(function(dataUrl){
if(dataUrl&&dataUrl.length<1200000){save(dataUrl);updateLogoImg();return}
var probe=new Image();
probe.onload=function(){viaCanvas(probe)};
probe.src=dataUrl}).catch(function(){
var img=new Image();img.crossOrigin='anonymous';
img.onload=function(){viaCanvas(img)};
img.src=LOGO_URL})}

var NAV=[
{g:'Overview',items:[['index','house','Dashboard'],['earn','zap','Earn Hub']]},
{g:'Earning',items:[['watch','play','Watch & Earn'],['scratch','gift','Scratch Card'],['tasks','target','Daily Tasks'],['checkin','calendar-check','Daily Check-In'],['spin','disc-3','Spin & Earn'],['offers','puzzle','Offers'],['refer','users','Refer & Earn']]},
{g:'Account',items:[['wallet','wallet','Wallet'],['withdraw','banknote','Withdraw'],['history','history','Transactions'],['notifications','bell','Notifications'],['profile','user','Profile']]}];

/* sk() accepts a number (px) or a string like '100%' for width */
function sk(w,h,r){return '<span class="sk" style="display:block;width:'+(typeof w==='string'?w:w+'px')+';height:'+h+'px'+(r?';border-radius:'+r+'px':'')+'"></span>'}

/* ============ SHELL ============ */
function mountShell(route){
var bnavHtml=[['index','house','Home'],['earn','zap','Earn'],['wallet','wallet','Wallet'],['history','history','History'],['profile','user','Profile']].map(function(it){
return '<a href="'+it[0]+'.html" data-route="'+it[0]+'"><span class="bi">'+ic(it[1])+'</span>'+it[2]+'</a>'}).join('');
 $('#app').innerHTML=
'<header class="dhdr"><a class="brand" href="index.html"><span class="mark"><img id="brandLogo" src="'+logoSrc()+'" alt="Adward"></span>Adward</a><div class="grow"></div>'
+'<button class="ico-btn" id="hBell">'+ic('bell')+'</button>'
+'<button class="ico-btn" id="burger">'+ic('menu')+'</button></header>'
+'<div class="netban" id="netban">'+ic('cloud-off')+" You're offline — rewards will sync once you reconnect</div>"
+'<div class="dover" id="dover"></div><aside class="drawer" id="drawer"></aside>'
+'<main class="main" id="view"></main>'
+'<nav class="bnav">'+bnavHtml+'</nav>';
icons();
 $('#hBell').onclick=function(){location.href='notifications.html'};
var dr=$('#drawer'),ov=$('#dover');
 $('#burger').onclick=function(){fillDrawer();dr.classList.add('open');ov.classList.add('open');document.body.style.overflow='hidden'};
ov.onclick=closeDr;
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeDr()});
 $$('.bnav a[data-route]').forEach(function(a){a.classList.toggle('on',a.dataset.route===route)});
var up=function(){var b=$('#netban');if(b)b.style.display=navigator.onLine?'none':'flex'};
addEventListener('offline',function(){up()});addEventListener('online',function(){up()});up()}
function closeDr(){var dr=$('#drawer'),ov=$('#dover');
dr.classList.remove('open');ov.classList.remove('open');document.body.style.overflow=''}

/* ============ CACHE / STATE ============ */
var CK='earnly_earn_cache_v1';
function loadCache(){try{var c=JSON.parse(localStorage.getItem(CK));if(c&&c.me&&c.me.daily)return c}catch(e){}return null}
var navType=(performance.getEntriesByType('navigation')[0]||{}).type||'navigate';
var snapKey='earnly_snap_watch_'+(localStorage.getItem('earnly_uid')||'anon');
if(navType==='reload'){sessionStorage.removeItem(snapKey);sessionStorage.removeItem('ad_pending')}
var ME=(function(){var c=loadCache();return c?c.me:null})();

/* restore last-known ad config from localStorage (offline support) */
var CFG_KEY='earnly_ad_config_v1';
(function(){
try{var c=JSON.parse(localStorage.getItem(CFG_KEY)||'null');if(!c)return;
if(c.link)AD_CONFIG.link=c.link;
if(typeof c.reward==='number')AD_CONFIG.reward=c.reward;
if(typeof c.minSeconds==='number')AD_CONFIG.minSeconds=c.minSeconds;
if(typeof c.daily==='number')AD_CONFIG.daily=c.daily}catch(e){}})();

function drawerHtml(){
return '<div class="dprof"><span class="avatar" style="width:42px;height:42px;font-size:14px">'+initials(ME.name)+'</span>'
+'<div><b>'+ME.name+'</b><span>'+money(ME.balance.available)+'</span></div></div>'
+NAV.map(function(g){return '<div class="sgroup">'+g.g+'</div>'+g.items.map(function(it){
return '<a class="slink" data-route="'+it[0]+'" href="'+it[0]+'.html">'+ic(it[1])+it[2]+'</a>'}).join('')}).join('')
+'<div class="dfoot"><button class="slink" id="drOut" style="color:var(--red)">'+ic('log-out')+'Log out</button></div>'}
function fillDrawer(){
var dr=$('#drawer');
if(!dr||dr.dataset.filled==='1'||!ME)return;
dr.dataset.filled='1';dr.innerHTML=drawerHtml();icons();
 /* logout → wipe auth + cached state → clean public boot (cache-buster).
    sessionStorage.clear() also drops any open ad_pending safely. */
 $('#drOut').onclick=function(){
try{localStorage.removeItem(FLAG);localStorage.removeItem('earnly_uid');
localStorage.removeItem(CK);localStorage.removeItem('earnly_dash_cache_v1');localStorage.removeItem(CFG_KEY);
sessionStorage.clear()}catch(e){}
firebase.auth().signOut().then(function(){location.replace('index.html?out='+Date.now())})};
 $$('a',dr).forEach(function(a){a.addEventListener('click',closeDr)})}

/* ============ SKELETON LOADER (mirrors real layout) ============ */
function skelMain(){
var s='';
s+='<div style="margin-bottom:18px">'
+sk(150,26,8)
+'<div style="height:10px"></div>'
+sk('100%',12,6)
+'<div style="height:7px"></div>'
+sk('76%',12,6)
+'</div>';
s+='<div class="card" style="padding:30px 20px 22px;text-align:center">'
+'<span class="sk" style="display:inline-block;width:72px;height:72px;border-radius:20px"></span>'
+'<div style="height:14px"></div>'
+'<span class="sk" style="display:inline-block;width:104px;height:22px;border-radius:7px;margin:0 auto"></span>'
+'<div style="height:12px"></div>'
+'<div style="display:flex;justify-content:center;flex-wrap:wrap;gap:8px">'
+sk(118,24,999)+sk(104,24,999)+sk(76,24,999)
+'</div>'
+'<div style="height:14px"></div>'
+sk('100%',12,6)
+'<div style="height:7px"></div>'
+sk('100%',12,6)
+'<div style="height:7px"></div>'
+sk('100%',12,6)
+'<div style="height:7px"></div>'
+'<div style="display:flex;justify-content:center">'+sk('50%',12,6)+'</div>'
+'<div style="height:18px"></div>'
+sk('100%',50,12)
+'</div>';

 $('#view').innerHTML=skelMain();icons()}

/* ============ TOASTS ============ */
function toast(type,title,msg){
var box=$('#toasts');if(!box)return;
var icon=type==='success'?'check':type==='error'?'x':type==='warn'?'alert-triangle':'info';
var el=document.createElement('div');el.className='toast t-'+type;
el.innerHTML='<span class="ti">'+ic(icon)+'</span><div><b>'+title+'</b>'+(msg?'<span>'+msg+'</span>':'')+'</div>';
box.appendChild(el);icons();
var kill=function(){el.classList.add('out');setTimeout(function(){el.remove()},260)};
el.onclick=kill;setTimeout(kill,4200)}

/* fetch ad settings from Firestore: config/watch */
function loadAdConfig(){
return fs.collection('config').doc('watch').get().then(function(snap){
if(!snap.exists)return;
var c=snap.data();
if(typeof c.link==='string'&&c.link)AD_CONFIG.link=c.link;
if(typeof c.reward==='number')AD_CONFIG.reward=c.reward;
if(typeof c.minSeconds==='number'&&c.minSeconds>0)AD_CONFIG.minSeconds=c.minSeconds;
if(typeof c.daily==='number')AD_CONFIG.daily=c.daily;
try{localStorage.setItem(CFG_KEY,JSON.stringify(AD_CONFIG))}catch(e){}
}).catch(function(){})}

function ymd(t){var d=t?new Date(t):new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function freshDaily(day){return{day:day,videos:{},scratched:0,spins:0,tasksClaimed:[],scratchLog:[],spinLog:[],activeCard:null,loginDone:false,todayEarned:0}}
function normDaily(d){var k=ymd();return(!d||d.day!==k||d.videos===undefined)?freshDaily(k):d}

var UID=null,LOGGED_IN=false;
function uRef(){return fs.collection('users').doc(UID)}
function snapK(){return 'earnly_snap_watch_'+UID}
function isUnlimited(){return !AD_CONFIG.daily||AD_CONFIG.daily<=0}

/* ============ RENDER (single Watch Ad card) ============ */
function render(){
var d=normDaily(ME.daily);
var watched=d.videos['ad']||0;
var unlimited=isUnlimited();
var left=unlimited?0:Math.max(0,AD_CONFIG.daily-watched);
var done=!unlimited&&left<=0;
var sy=window.scrollY;
 $('#view').innerHTML='<div class="phead ptitle"><h1>Watch &amp; Earn</h1><p>Watch a short sponsor ad — your reward is credited automatically when you return.</p></div>'
+'<div class="card adcard">'
+'<span class="adicon"><img id="adLogoImg" src="'+logoSrc()+'" alt="Sponsor logo"></span>'
+'<h3>'+(done?'All done for today':'Watch Ad')+'</h3>'
+'<div class="vmeta"><span class="chip chip-mint">'+ic('coins')+' '+money(AD_CONFIG.reward)+' per watch</span>'
+'<span class="chip">'+ic('clock')+' '+AD_CONFIG.minSeconds+'s minimum</span>'
+(unlimited
?'<span class="chip">'+ic('infinity')+' Unlimited</span>'
:'<span class="chip">'+left+' of '+AD_CONFIG.daily+' left</span>')
+'</div>'
+'<p class="adsub">'+(done
?'You&#39;ve completed all available ads for today. Come back tomorrow for a fresh batch of sponsor ads.'
:'Tap the button below — the sponsor ad opens in a new tab. Stay on it for at least '+AD_CONFIG.minSeconds+' seconds, then come back and your reward is credited automatically.')+'</p>'
+(done
?'<button class="btn btn-ghost btn-block" disabled>'+ic('check')+' Completed for today</button>'
:'<button class="btn btn-primary btn-block" id="watchBtn">'+ic('play')+' Watch ad now</button>')
+'</div>'
+'<div class="note">'+ic('shield')+'<span>Stay on the ad tab for the full duration — closing it too early means the watch will not count, and each reward can only be claimed once.</span></div>';
icons();
window.scrollTo(0,sy);
bindView();
/* reload while the ad tab was open → restore the live counter */
if(pending&&!done)setWatchBtn('counting',pending.at);
try{sessionStorage.setItem(snapK(),$('#view').innerHTML)}catch(e){}
}
function bindView(){
var b=$('#watchBtn');
if(b&&!b.dataset.bound){b.dataset.bound='1';
b.addEventListener('click',function(){
if(!LOGGED_IN){showLoginSheet();return}
openAd()})}}

/* ============ WATCH BUTTON STATE MACHINE (UI only) ============
   idle → (click, ad opens) → counting → (return) → verifying (1s)
     → time met → credit → idle
     → too short → failed (2s) → idle
   The seconds shown are computed from the REAL start timestamp
   (Date.now()-start), so background-tab timer throttling can never
   make the display drift — it self-corrects every tick. */
var btnTimer=null,btnFailTimer=null;
function setWatchBtn(state,startAt){
var b=$('#watchBtn');if(!b)return;
if(btnTimer){clearInterval(btnTimer);btnTimer=null}
if(btnFailTimer){clearTimeout(btnFailTimer);btnFailTimer=null}
if(state==='counting'){
b.disabled=true;b.className='btn btn-block btn-counting';
var tick=function(){
var s=Math.floor((Date.now()-startAt)/1000);
if(s>=AD_CONFIG.minSeconds){
b.className='btn btn-block btn-met';
b.innerHTML='<span class="wdot"></span> Time met — return to claim ✓'}
else{
b.className='btn btn-block btn-counting';
b.innerHTML='<span class="wdot"></span> Watching… '+s+'s / '+AD_CONFIG.minSeconds+'s'}};
tick();btnTimer=setInterval(tick,1000)}
else if(state==='verifying'){
b.disabled=true;b.className='btn btn-primary btn-block';
b.innerHTML='<span class="spinner"></span> Verifying…'}
else if(state==='failed'){
b.disabled=true;b.className='btn btn-block btn-fail';
b.innerHTML=ic('circle-x')+' Not completed — watch time too short';
btnFailTimer=setTimeout(function(){setWatchBtn('idle')},2200)}
else{
b.disabled=false;b.className='btn btn-primary btn-block';
b.innerHTML=ic('play')+' Watch ad now'}
icons()}

/* ============ AD FLOW ============ */
var pending=null;
try{var _p=sessionStorage.getItem('ad_pending');if(_p)pending={at:Number(_p)}}catch(e){}
function openAd(){
if(!AD_CONFIG.link||AD_CONFIG.link.indexOf('http')!==0){
toast('warn','Ad link not set','Set the "link" field in Firestore (config/watch) to your Adsterra direct link');return}
if(pending){toast('info','Ad already open','Finish watching in the other tab, then come back');return}
var d=normDaily(ME.daily);
if(!isUnlimited()&&(d.videos['ad']||0)>=AD_CONFIG.daily){render();return}
pending={at:Date.now()};
try{sessionStorage.setItem('ad_pending',String(pending.at))}catch(e){}
var w=window.open(AD_CONFIG.link,'_blank');
if(!w){toast('warn','Pop-up blocked','Allow pop-ups for this site, then try again');
pending=null;try{sessionStorage.removeItem('ad_pending')}catch(e){}return}
/* button → live second counter while the user is on the ad tab */
setWatchBtn('counting',pending.at)}
function settleAd(){
if(!pending)return;
var at=pending.at;pending=null;
try{sessionStorage.removeItem('ad_pending')}catch(e){}
/* stop the counter the instant the user is back */
if(btnTimer){clearInterval(btnTimer);btnTimer=null}
var secs=Math.round((Date.now()-at)/1000);
/* counter → "Verifying…" — exactly 1 second, during which the
   watch duration is checked against the required minimum */
setWatchBtn('verifying');
setTimeout(function(){
if(secs<AD_CONFIG.minSeconds){
/* too short → red "Not completed" (2s) + warning toast → idle */
setWatchBtn('failed');
toast('warn','Watch not completed','You came back in '+secs+'s — stay on the ad at least '+AD_CONFIG.minSeconds+' seconds to earn');
return}
/* full duration met → verify & credit (available + earned) */
creditWatch(secs)},1000)}
document.addEventListener('visibilitychange',function(){
if(document.visibilityState==='visible')settleAd()});
window.addEventListener('focus',settleAd);

function creditWatch(secs){
var d=normDaily(ME.daily);
var watched=d.videos['ad']||0;
if(!isUnlimited()&&watched>=AD_CONFIG.daily){render();return}
var reward=AD_CONFIG.reward;
d.videos['ad']=watched+1;
d.todayEarned=(d.todayEarned||0)+reward;
ME.daily=d;
if(ME.balance&&typeof ME.balance.available==='number')ME.balance.available+=reward;
/* keep balance.earned in sync — this is the field the dashboard
   "Total earned" stat AND the referral ৳100 threshold both read */
if(ME.balance&&typeof ME.balance.earned==='number')ME.balance.earned+=reward;
saveME();render();
toast('success','+'+money(reward)+' credited','Watch completed in '+secs+'s — added to your wallet');
uRef().update({
'daily.videos.ad':firebase.firestore.FieldValue.increment(1),
'daily.todayEarned':firebase.firestore.FieldValue.increment(reward),
'balance.available':firebase.firestore.FieldValue.increment(reward),
'balance.earned':firebase.firestore.FieldValue.increment(reward)
}).catch(function(){
toast('warn','Sync pending','You appear to be offline — the reward is saved locally and will sync')})}

function saveME(){try{var old=JSON.parse(localStorage.getItem(CK)||'{}');old.uid=UID;old.me=ME;localStorage.setItem(CK,JSON.stringify(old))}catch(e){}}

/* ============ AUTH ============ */
var sawUser=false,handled=false;
auth.onAuthStateChanged(function(u){
if(!u){
if(sawUser){
try{localStorage.removeItem(FLAG);localStorage.removeItem('earnly_uid');
localStorage.removeItem(CK);localStorage.removeItem('earnly_dash_cache_v1');localStorage.removeItem(CFG_KEY);
sessionStorage.clear()}catch(e){}
location.replace('index.html?out='+Date.now());return}
showLoginSheet();return}
if(handled)return;handled=true;sawUser=true;
LOGGED_IN=true;
hideLoginSheet();
UID=u.uid;localStorage.setItem('earnly_uid',UID);localStorage.setItem(FLAG,'1');
if(!ME){var c=loadCache();if(c&&c.me)ME=c.me}
if(!ME){location.replace('index.html');return}
/* fetch user profile AND ad config in parallel, then render */
Promise.all([
uRef().get().catch(function(){return null}),
loadAdConfig()
]).then(function(res){
var snap=res[0];
if(snap&&snap.exists){ME=snap.data();saveME()}
render();
/* page loaded while user is already back from the ad (reload case)
   → run the verify flow now */
if(pending&&document.visibilityState==='visible')settleAd()
}).catch(function(){render()})});
</script>
